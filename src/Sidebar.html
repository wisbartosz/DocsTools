<!DOCTYPE html>
<html lang="<?= uiLanguage_() ?>">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include_('Styles'); ?>
</head>
<body class="<?= mode ?>">
  <nav class="tabs">
    <button class="tab active" data-tab="assistant"><?= t_('tab.assistant') ?></button>
    <button class="tab" data-tab="check"><?= t_('tab.check') ?></button>
    <button class="tab" data-tab="sources"><?= t_('tab.sources') ?></button>
    <button class="tab tab-icon" data-tab="settings" title="<?= t_('tab.settings') ?>" aria-label="<?= t_('tab.settings') ?>"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
  </nav>

  <div id="message" class="message hidden"></div>

  <section id="tab-assistant" class="panel">
    <div id="assistant-no-sources" class="hint hidden"><?= t_('assistant.noSources') ?></div>
    <div id="assistant-content" class="hidden">
      <details id="assistant-sources">
        <summary id="assistant-sources-summary"></summary>
        <div class="row buttons">
          <button id="btn-select-all" class="link"><?= t_('assistant.selectAll') ?></button>
          <button id="btn-select-none" class="link"><?= t_('assistant.selectNone') ?></button>
        </div>
        <ul id="assistant-source-list" class="checklist"></ul>
      </details>
      <button id="btn-attach-fragment" class="link"><?= t_('assistant.fragment.attach') ?></button>
      <div id="fragment-box" class="fragment hidden">
        <div class="fragment-head">
          <span id="fragment-title"></span>
          <button id="btn-remove-fragment" class="link"><?= t_('assistant.fragment.remove') ?></button>
        </div>
        <div id="fragment-text" class="fragment-text"></div>
      </div>
      <textarea id="question" rows="3" placeholder="<?= t_('assistant.placeholder') ?>"></textarea>
      <div class="row ask-row">
        <button id="btn-ask" class="primary"><?= t_('assistant.ask') ?></button>
        <span id="assistant-size" class="muted small"></span>
      </div>
      <div id="assistant-size-warning" class="message warn hidden"><?= t_('assistant.sizeWarning') ?></div>
      <div id="answers"></div>
    </div>
  </section>

  <section id="tab-check" class="panel hidden">
    <label class="rules-check check-option"><input id="skip-title-page" type="checkbox" checked> <?= t_('check.skipTitle') ?></label>
    <div class="muted small"><?= t_('check.skipTitleHint') ?></div>
    <h3><?= t_('typo.title') ?></h3>
    <div class="muted small"><?= t_('typo.hint') ?></div>
    <div class="row buttons">
      <button id="btn-check-typo" class="primary"><?= t_('typo.check') ?></button>
    </div>
    <div id="typo-summary" class="muted hidden"></div>
    <div id="typo-groups"></div>

    <h3><?= t_('format.title') ?></h3>
    <div class="muted small"><?= t_('format.hint') ?></div>
    <details id="format-rules" class="typo-group">
      <summary><?= t_('format.rules.title') ?></summary>
      <div class="typo-desc"><?= t_('format.rules.hint') ?></div>
      <div id="format-rules-example" class="message warn hidden"><?= t_('format.rules.example') ?></div>
      <div class="row buttons">
        <button id="btn-import-rules"><?= t_('format.rules.import') ?></button>
      </div>
      <div class="typo-desc"><?= t_('format.rules.importHint') ?></div>
      <div id="rules-import-result" class="hidden"></div>
      <div class="rules-grid">
        <b class="rules-head"><?= t_('format.rules.text') ?></b>
        <label for="rule-font"><?= t_('format.rules.font') ?></label><input id="rule-font" type="text">
        <label for="rule-size"><?= t_('format.rules.size') ?></label><input id="rule-size" type="number" step="0.5" min="0">
        <label for="rule-line-spacing"><?= t_('format.rules.lineSpacing') ?></label><input id="rule-line-spacing" type="number" step="0.05" min="0">
        <label for="rule-alignment"><?= t_('format.rules.alignment') ?></label>
        <select id="rule-alignment">
          <option value=""><?= t_('format.align.any') ?></option>
          <option value="JUSTIFY"><?= t_('format.align.JUSTIFY') ?></option>
          <option value="LEFT"><?= t_('format.align.LEFT') ?></option>
        </select>
        <label for="rule-indent"><?= t_('format.rules.indent') ?></label><input id="rule-indent" type="number" step="0.05" min="0">
        <label class="rules-check"><input id="rule-black" type="checkbox"> <?= t_('format.rules.black') ?></label>

        <b class="rules-head"><?= t_('format.rules.page') ?></b>
        <label class="rules-check"><input id="rule-a4" type="checkbox"> <?= t_('format.rules.a4') ?></label>
        <span class="rules-wide muted"><?= t_('format.rules.margins') ?></span>
        <label for="rule-margin-top"><?= t_('format.rules.top') ?></label><input id="rule-margin-top" type="number" step="0.1" min="0">
        <label for="rule-margin-right"><?= t_('format.rules.right') ?></label><input id="rule-margin-right" type="number" step="0.1" min="0">
        <label for="rule-margin-bottom"><?= t_('format.rules.bottom') ?></label><input id="rule-margin-bottom" type="number" step="0.1" min="0">
        <label for="rule-margin-left"><?= t_('format.rules.left') ?></label><input id="rule-margin-left" type="number" step="0.1" min="0">

        <b class="rules-head"><?= t_('format.rules.heading1') ?></b>
        <label for="rule-h1-size"><?= t_('format.rules.size') ?></label><input id="rule-h1-size" type="number" step="0.5" min="0">
        <label class="rules-check"><input id="rule-h1-bold" type="checkbox"> <?= t_('format.rules.bold') ?></label>
        <label class="rules-check"><input id="rule-h1-upper" type="checkbox"> <?= t_('format.rules.uppercase') ?></label>

        <b class="rules-head"><?= t_('format.rules.heading2') ?></b>
        <label for="rule-h2-size"><?= t_('format.rules.size') ?></label><input id="rule-h2-size" type="number" step="0.5" min="0">
        <label class="rules-check"><input id="rule-h2-bold" type="checkbox"> <?= t_('format.rules.bold') ?></label>

        <b class="rules-head"><?= t_('format.rules.headings') ?></b>
        <label class="rules-check"><input id="rule-no-period" type="checkbox"> <?= t_('format.rules.noHeadingPeriod') ?></label>
        <label class="rules-check"><input id="rule-new-page" type="checkbox"> <?= t_('format.rules.chapterNewPage') ?></label>
        <label for="rule-caption-size"><?= t_('format.rules.captionSize') ?></label><input id="rule-caption-size" type="number" step="0.5" min="0">
      </div>
      <div class="row buttons">
        <button id="btn-save-rules" class="primary"><?= t_('format.rules.save') ?></button>
      </div>
    </details>
    <div class="row buttons">
      <button id="btn-check-format" class="primary"><?= t_('format.check') ?></button>
    </div>
    <div id="format-summary" class="muted hidden"></div>
    <div id="format-groups"></div>
  </section>

  <section id="tab-sources" class="panel hidden">
    <div id="sources-no-folder" class="hint hidden"><?= t_('sources.noFolder') ?></div>
    <div id="sources-content" class="hidden">
      <div class="row">
        <span id="sources-summary" class="muted"></span>
      </div>
      <div class="row buttons">
        <button id="btn-process" class="primary"><?= t_('sources.process') ?></button>
        <button id="btn-refresh"><?= t_('sources.refresh') ?></button>
      </div>
      <div id="process-progress" class="muted hidden"></div>
      <ul id="sources-list" class="list"></ul>
    </div>
  </section>

  <section id="tab-settings" class="panel hidden">
    <h3><?= t_('settings.folder.title') ?></h3>
    <div id="folder-current" class="muted"></div>
    <input id="folder-input" type="text" placeholder="<?= t_('settings.folder.placeholder') ?>">
    <div class="row buttons">
      <button id="btn-save-folder" class="primary"><?= t_('settings.folder.save') ?></button>
    </div>

    <h3><?= t_('settings.key.title') ?></h3>
    <div id="key-status" class="muted"></div>
    <input id="key-input" type="password" placeholder="<?= t_('settings.key.placeholder') ?>" autocomplete="off">
    <div class="row buttons">
      <button id="btn-save-key" class="primary"><?= t_('settings.key.save') ?></button>
      <button id="btn-clear-key"><?= t_('settings.key.clear') ?></button>
    </div>
    <div class="muted small">
      <?= t_('settings.key.hint') ?> <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>.
      <?= t_('settings.key.storage') ?>
    </div>

    <h3><?= t_('settings.model.title') ?></h3>
    <select id="model-select" disabled>
      <option value=""><?= t_('settings.model.needKey') ?></option>
    </select>
    <div class="row buttons">
      <button id="btn-save-model" class="primary"><?= t_('settings.model.save') ?></button>
      <button id="btn-test"><?= t_('settings.model.test') ?></button>
    </div>
    <div class="muted small"><?= t_('settings.model.hint') ?></div>

    <h3><?= t_('update.title') ?></h3>
    <div id="update-status" class="muted"><?= t_('update.checking') ?></div>
    <div id="update-notes" class="update-notes hidden"></div>
    <div class="row buttons">
      <button id="btn-install-update" class="primary hidden"><?= t_('update.install') ?></button>
      <button id="btn-check-update"><?= t_('update.check') ?></button>
    </div>
    <div id="update-install-hint" class="muted small hidden"><?= t_('update.installHint') ?></div>
    <div class="small"><a id="link-installer" href="#" target="_blank"><?= t_('update.openInstaller') ?></a></div>

    <h3><?= t_('settings.language.title') ?></h3>
    <select id="language-select">
      <option value=""><?= t_('settings.language.auto') ?></option>
      <option value="pl">Polski</option>
      <option value="en">English</option>
    </select>
    <div class="row buttons">
      <button id="btn-save-language" class="primary"><?= t_('settings.language.save') ?></button>
    </div>
  </section>

  <section id="tab-feedback" class="panel hidden">
    <h3><?= t_('feedback.title') ?></h3>
    <div class="muted small"><?= t_('feedback.hint') ?></div>
    <textarea id="feedback-message" rows="7" maxlength="5000" placeholder="<?= t_('feedback.placeholder') ?>"></textarea>
    <input id="feedback-email" type="email" placeholder="<?= t_('feedback.email') ?>" autocomplete="email">
    <div class="row buttons">
      <button id="btn-send-feedback" class="primary"><?= t_('feedback.send') ?></button>
    </div>
    <div class="muted small"><?= t_('feedback.privacy') ?></div>
  </section>

  <footer class="footer muted small">
    <? if (mode === 'sidebar') { ?>
      <button id="btn-enlarge" class="link" title="<?= t_('assistant.enlargeHint') ?>">⤢ <?= t_('assistant.enlarge') ?></button>
    <? } ?>
    <button id="btn-feedback" class="link"><?= t_('feedback.open') ?></button>
    <span class="version"><?!= include_('Logo') ?><?= APP_SHORT_NAME ?> <?= APP_VERSION ?></span>
  </footer>

  <div id="ai-notice" class="overlay hidden">
    <div class="notice">
      <h3><?= t_('notice.title') ?></h3>
      <p><?= t_('notice.body') ?></p>
      <p><?= t_('notice.warning') ?></p>
      <div class="row buttons">
        <button id="btn-notice-accept" class="primary"><?= t_('notice.accept') ?></button>
        <button id="btn-notice-cancel"><?= t_('notice.cancel') ?></button>
      </div>
    </div>
  </div>

  <script>
    const UI_LANG = <?!= JSON.stringify(uiLanguage_()) ?>;
    const UI_MODE = <?!= JSON.stringify(mode) ?>;
    const I18N = <?!= JSON.stringify(uiMessages_()) ?>;
  </script>
  <?!= include_('Client'); ?>
</body>
</html>
