<style>
  :root {
    --accent: #0b57d0;
    --accent-strong: #0842a0;
    --accent-soft: #d3e3fd;
    --text: #1f1f1f;
    --muted: #5e5e5e;
    --border: #dadce0;
    --surface: #f8fafd;
    --chip: #f1f4f9;
    --ok: #146c2e;
    --ok-soft: #e6f4ea;
    --warn: #7a4a00;
    --warn-mark: #b26b00;
    --warn-soft: #fff3dc;
    --err: #b3261e;
    --err-soft: #fdecea;
    --radius-s: 8px;
    --radius-m: 12px;
    --radius-pill: 18px;
    --footer-h: 35px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 12px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font: 13px/1.45 Roboto, Arial, sans-serif;
    color: var(--text);
    background: #fff;
  }
  h3 { font-size: 13px; margin: 16px 0 6px; }
  a { color: var(--accent); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; margin-top: 4px; }
  .footer {
    position: sticky;
    bottom: 0;
    height: var(--footer-h);
    box-sizing: border-box;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: auto -12px 0;
    padding: 6px 12px;
    border-top: 1px solid var(--border);
    background: #fff;
    z-index: 3;
  }
  .footer .version { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  body.window .footer { margin: auto -24px 0; padding: 6px 24px; }
  .panel { padding-bottom: 16px; }
  .panel > :first-child { margin-top: 0; }
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin: 0 -12px 10px;
    padding: 0 12px;
    position: sticky;
    top: 0;
    z-index: 3;
    background: #fff;
  }
  .tab {
    border: 0;
    background: none;
    padding: 10px 7px 8px;
    white-space: nowrap;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font: inherit;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab { border-radius: 0; font-weight: 400; }
  button.tab:not(:disabled):hover { background: none; color: var(--text); }
  .tab.active { font-weight: 500; }
  button.tab.active:not(:disabled):hover { color: var(--accent); }
  .tab-icon { margin-left: auto; }
  .tab-icon svg { vertical-align: -3px; }
  .update-notes {
    white-space: pre-wrap;
    background: #f8f9fa;
    border-radius: 6px;
    padding: 8px 10px;
    margin: 6px 0;
    font-size: 12px;
  }
  .tab-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-left: 5px;
    vertical-align: 2px;
    border-radius: 50%;
    background: var(--accent);
  }
  .tab-spinner {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-left: 6px;
    vertical-align: 0;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  .row { margin: 6px 0; }
  .buttons { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    background: #fff;
    color: var(--accent);
    font-weight: 500;
    cursor: pointer;
  }
  button:not(:disabled):hover { background: var(--surface); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:not(:disabled):hover { background: var(--accent-strong); }
  button.btn-tonal { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent-strong); font-size: 12px; padding: 5px 12px; }
  button.btn-tonal:not(:disabled):hover { background: #c2d7fb; }
  button.btn-small { font-size: 12px; padding: 3px 10px; flex: 0 0 auto; align-self: center; }
  button.btn-small:not(:disabled):hover { background: var(--accent-soft); border-color: var(--accent-soft); }
  #message:not(.hidden) { position: sticky; top: 41px; z-index: 2; box-shadow: 0 1px 3px rgba(60, 64, 67, .2); }
  .result-snippet:focus-visible, .result-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (forced-colors: active) { .sev { forced-color-adjust: none; } }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=password], input[type=email], select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    font: inherit;
    margin: 4px 0;
  }
  .message {
    padding: 8px 10px;
    border-radius: var(--radius-s);
    margin-bottom: 8px;
    background: #e8f0fe;
  }
  .message.error { background: var(--err-soft); color: var(--err); }
  .message.ok { background: var(--ok-soft); color: var(--ok); }
  .hint { padding: 10px 12px; background: var(--chip); border-radius: var(--radius-s); }
  .list { list-style: none; margin: 8px 0 0; padding: 0; }
  .list li { padding: 7px 0; border-bottom: 1px solid #f1f3f4; }
  .list .name { display: block; word-break: break-word; }
  .list .meta { font-size: 12px; color: var(--muted); }
  .status-ok { color: var(--ok); }
  .status-pending, .status-changed, .status-outdated, .status-empty { color: var(--warn); }
  .status-error { color: var(--err); }
  .status-unsupported { color: var(--muted); }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(32, 33, 36, .45);
    display: flex;
    align-items: center;
    padding: 12px;
  }
  .notice { background: #fff; border-radius: 6px; padding: 4px 14px 12px; }
  .message.warn { background: var(--warn-soft); color: var(--warn); font-size: 12px; }
  details { margin-bottom: 8px; }
  summary { cursor: pointer; color: var(--muted); padding: 4px 0; }
  button.link { border: 0; padding: 2px 0; color: var(--accent); background: none; font-weight: 400; border-radius: 0; }
  button.link:hover { background: none; text-decoration: underline; }
  .checklist { list-style: none; margin: 4px 0 0; padding: 0; max-height: 180px; overflow-y: auto; }
  .checklist li { padding: 3px 0; }
  .checklist label { display: flex; gap: 6px; align-items: flex-start; cursor: pointer; word-break: break-word; }
  .checklist input { margin-top: 3px; }
  textarea {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    font: inherit;
    resize: vertical;
  }
  #tab-feedback textarea { margin-top: 8px; }
  .typo-group { border: 1px solid var(--border); border-radius: var(--radius-m); padding: 4px 12px; margin: 10px 0; }
  .typo-group > summary { color: var(--text); font-weight: 500; }
  .typo-group .typo-desc { font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
  .result-group { border: 1px solid var(--border); border-radius: var(--radius-m); padding: 2px 12px; margin: 10px 0; background: #fff; }
  .result-group[open] { padding-bottom: 10px; }
  .result-head { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 500; padding: 8px 0; list-style: none; }
  .result-head::-webkit-details-marker { display: none; }
  .result-head::after { content: ''; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 2px 3px 4px; }
  .result-group[open] > .result-head::after { transform: rotate(225deg); margin-bottom: -3px; }
  .result-title { flex: 1; min-width: 0; }
  .result-count { font-size: 12px; font-weight: 400; color: var(--muted); }
  .sev { display: inline-block; flex: 0 0 8px; width: 8px; height: 8px; border-radius: 4px; background: var(--err); }
  .sev-review { border-radius: 1px; background: var(--warn-mark); transform: rotate(45deg); }
  .result-desc { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .result-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .result-item { display: flex; gap: 8px; align-items: flex-start; background: var(--surface); border-radius: var(--radius-s); padding: 7px 10px; }
  .result-snippet { flex: 1; min-width: 0; cursor: pointer; font-size: 12px; word-break: break-word; white-space: pre-wrap; }
  .result-snippet:hover { color: var(--accent-strong); }
  .result-snippet.static { cursor: default; }
  .result-snippet.static:hover { color: inherit; }
  .result-snippet mark { background: #ffe08a; border-radius: 2px; padding: 0 1px; color: var(--text); }
  .result-detail { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .result-where { color: var(--muted); font-size: 11px; margin-right: 4px; }
  .result-note { font-size: 12px; color: var(--muted); }
  body.window .result-groups-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; align-items: start; margin-top: 10px; }
  body.window .result-groups-grid > .result-group { margin: 0; }
  .rules-grid { display: grid; grid-template-columns: 1fr 112px; gap: 4px 8px; align-items: center; font-size: 12px; margin: 6px 0; }
  .rules-grid input[type=text], .rules-grid input[type=number], .rules-grid select { margin: 0; padding: 4px 6px; }
  .rules-grid input[type=number] { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-s); font: inherit; }
  #rule-font, label[for=rule-font] { grid-column: 1 / -1; }
  .rules-head, .rules-check, .rules-wide { grid-column: 1 / -1; }
  .rules-head { margin-top: 8px; font-weight: 500; }
  .rules-check { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #rules-import-result { margin: 6px 0; font-size: 12px; }
  .rules-conflicts-title { color: var(--warn); margin-bottom: 4px; }
  .rules-conflict { border-left: 3px solid var(--warn); padding: 2px 8px; margin: 4px 0 8px; }
  .rules-conflict-field { font-weight: 500; margin-bottom: 2px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .center { text-align: center; }
  .check-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 12px; }
  .chip-select select { width: auto; margin: 0; padding: 4px 26px 4px 10px; border-radius: 16px; background-color: var(--chip); font-size: 12px; }
  button.wide { display: block; width: 100%; padding: 10px 16px; font-size: 14px; min-height: 42px; }
  #check-last { margin: 6px 0 12px; }
  .counters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  .counter { border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
  .counter b { font-size: 20px; line-height: 1.2; }
  .counter span { font-size: 11px; }
  .counter-fix { background: var(--err-soft); color: var(--err); }
  .counter-review { background: var(--warn-soft); color: var(--warn); }
  .counter-ok { background: var(--ok-soft); color: var(--ok); }
  .module-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius-m); overflow: hidden; }
  button.module-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #eef0f2; border-radius: 0; background: #fff; color: var(--text); font-weight: 400; padding: 10px 12px; min-height: 44px; }
  button.module-row:last-child { border-bottom: 0; }
  button.module-row:not(:disabled):hover { background: var(--surface); }
  .module-badge { flex: 0 0 22px; height: 22px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: var(--chip); color: var(--muted); }
  .state-fix .module-badge { background: var(--err); color: #fff; }
  .state-review .module-badge { background: var(--warn-soft); color: var(--warn); }
  .state-error .module-badge { background: var(--err-soft); color: var(--err); }
  .state-ok .module-badge { background: var(--ok-soft); }
  .state-ok .module-badge::before { content: ''; width: 9px; height: 5px; border-left: 2px solid var(--ok); border-bottom: 2px solid var(--ok); transform: rotate(-45deg); margin-top: -2px; }
  .state-none .module-badge::before, .state-unavailable .module-badge::before { content: ''; width: 8px; height: 2px; background: var(--muted); }
  .module-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .module-name { font-weight: 500; }
  .module-status { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .state-error .module-status { color: var(--err); }
  .module-chevron { width: 7px; height: 7px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); margin-right: 4px; }
  .view-head { display: flex; align-items: center; gap: 6px; margin: 2px 0 8px; }
  .view-title { flex: 1; font-size: 15px; font-weight: 500; }
  button.icon-btn { width: 32px; height: 32px; padding: 0; border: 0; border-radius: 16px; background: none; color: var(--text); display: inline-flex; align-items: center; justify-content: center; }
  button.icon-btn:not(:disabled):hover { background: var(--chip); }
  button.icon-btn:focus { outline: none; }
  button.icon-btn:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  #btn-module-recheck { color: var(--accent); }
  button.icon-btn.loading::before { margin: 0; }
  button.icon-btn.loading svg { display: none; }
  .btn-view-back { margin-left: -8px; }
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .filter-chips:empty { display: none; }
  button.filter-chip { font-size: 12px; font-weight: 400; color: var(--text); border-radius: var(--radius-s); padding: 4px 10px; }
  button.filter-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
  .module-hint { margin-bottom: 8px; cursor: pointer; }
  .module-hint.collapsed { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .result-desc.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .result-desc.clampable { cursor: pointer; }
  .result-desc.clampable:focus-visible, .module-hint:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  #format-rules-example, #structure-rules-example, #bib-rules-example { display: none !important; }
  .rules-banner { border-radius: 10px; padding: 9px 12px; font-size: 12px; margin-bottom: 10px; background: var(--chip); color: var(--text); }
  .rules-banner.is-default { background: var(--ok-soft); color: var(--ok); }
  button.btn-tonal.wide { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font-size: 13px; padding: 9px 14px; }
  .rules-import-hint { margin: 6px 0 10px; }
  .segmented { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; margin: 10px 0 12px; }
  button.segment { border: 0; border-right: 1px solid var(--border); border-radius: 0; background: #fff; color: var(--text); font-weight: 400; font-size: 12px; padding: 7px 2px; }
  button.segment:last-child { border-right: 0; }
  button.segment.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 500; }
  button.segment:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
  .rules-pane { display: none; }
  .rules-pane.active { display: block; }
  .rules-pane-title { display: none; margin: 0 0 8px; font-size: 13px; }
  .rules-pane-hint { margin-bottom: 8px; }
  .rules-actions { position: sticky; bottom: var(--footer-h); z-index: 2; display: flex; align-items: center; gap: 12px; margin: 14px -12px 0; padding: 10px 12px; background: #fff; border-top: 1px solid var(--border); }
  #rules-dirty { margin: 0; color: var(--warn); }
  .rules-actions button { white-space: nowrap; }
  body.window .segmented { display: none; }
  body.window .rules-panes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
  body.window .rules-pane { display: block; border: 1px solid var(--border); border-radius: var(--radius-m); padding: 12px 14px; }
  body.window .rules-pane-title { display: block; }
  body.window .rules-actions { margin: 14px -24px 0; padding: 10px 24px; }
  .update-banner { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; padding: 7px 10px; border-radius: 10px; background: var(--accent-soft); color: #041e49; font-size: 12px; }
  .update-banner span { flex: 1; }
  .update-banner button.link { font-weight: 500; color: var(--accent-strong); }
  .assistant-start { padding-top: 8px; }
  .start-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
  .start-steps { list-style: none; margin: 14px 0 0; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-m); overflow: hidden; }
  .start-step { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-bottom: 1px solid #eef0f2; }
  .start-step:last-child { border-bottom: 0; }
  .start-step.current { background: var(--surface); }
  .start-mark { flex: 0 0 24px; height: 24px; border-radius: 12px; border: 1px solid var(--border); box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--muted); }
  .start-step.current .start-mark { background: var(--accent); border-color: var(--accent); color: #fff; }
  .start-step.done .start-mark { background: var(--ok-soft); border-color: var(--ok-soft); }
  .start-step.done .start-mark::before { content: ''; width: 9px; height: 5px; border-left: 2px solid var(--ok); border-bottom: 2px solid var(--ok); transform: rotate(-45deg); margin-top: -2px; }
  .start-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .start-name { font-weight: 500; }
  .start-detail { font-size: 12px; color: var(--muted); word-break: break-word; }
  button.start-action { align-self: flex-start; margin-top: 8px; }
  .sources-chip { margin: 4px 0 8px; }
  .sources-chip > summary { display: inline-flex; align-items: center; gap: 6px; list-style: none; font-size: 12px; color: var(--text); background: var(--chip); border: 1px solid var(--border); border-radius: 16px; padding: 4px 12px; }
  .sources-chip > summary::-webkit-details-marker { display: none; }
  .sources-chip > summary::after { content: ''; width: 6px; height: 6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 2px 3px 2px; }
  .sources-panel { border: 1px solid var(--border); border-radius: var(--radius-m); padding: 6px 12px; margin-top: 6px; }
  #tab-assistant:not(.hidden) { flex: 1 0 auto; display: flex; flex-direction: column; padding-bottom: 0; }
  #assistant-content:not(.hidden) { flex: 1 0 auto; display: flex; flex-direction: column; }
  #answers { flex: 1 0 auto; }
  #answers > .thread { scroll-margin-top: 52px; }
  #answers:empty::before { content: attr(data-empty); display: block; margin-top: 24px; text-align: center; color: var(--muted); font-size: 12px; padding: 0 12px; }
  .composer { position: sticky; bottom: var(--footer-h); z-index: 2; background: #fff; margin: 10px -12px 0; padding: 10px 12px 8px; border-top: 1px solid var(--border); }
  body.window .composer { margin: 10px -24px 0; padding: 10px 24px 8px; }

  .composer-box:focus-within { border-color: var(--accent); }
  .composer-box textarea { border: 0; padding: 4px 0; resize: none; outline: none; flex: 1; }
  button.send-btn { flex: 0 0 34px; width: 34px; height: 34px; padding: 0; border-radius: 17px; display: inline-flex; align-items: center; justify-content: center; }
  button.send-btn.loading::before { margin: 0; }
  button.send-btn.loading svg { display: none; }
  .composer-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 8px; margin-top: 6px; }
  .composer-meta #btn-attach-fragment { margin: 0; font-size: 12px; white-space: nowrap; }
  .composer-meta #assistant-size { margin: 0 0 0 auto; white-space: nowrap; }
  .cites li { border: 1px solid var(--border); border-radius: var(--radius-s); padding: 6px 8px; margin-bottom: 6px; list-style-position: inside; }
  .settings-card { border: 1px solid var(--border); border-radius: var(--radius-m); margin: 0 0 12px; overflow: hidden; }
  .card-title { padding: 10px 12px 2px; font-size: 11px; font-weight: 500; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
  .card-row, .card-toggle { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #eef0f2; }
  .card-toggle { cursor: pointer; }
  .card-toggle input { width: 18px; height: 18px; flex: 0 0 auto; accent-color: var(--accent); }
  .card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .settings-card > :last-child { border-bottom: 0; }
  .card-field label { display: block; font-size: 12px; color: var(--muted); }
  .check-option { margin-top: 8px; font-size: 13px; }
  .rules-grid textarea { grid-column: 1 / -1; font-size: 12px; }
  #btn-attach-fragment { margin: 0 0 6px; text-align: left; }
  .fragment, .thread-fragment {
    border-left: 3px solid var(--accent);
    background: #f8f9fa;
    border-radius: 0 4px 4px 0;
    padding: 4px 8px;
    margin: 0 0 6px;
    font-size: 12px;
