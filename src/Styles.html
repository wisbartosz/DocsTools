<style>
  :root {
    --accent: #1a73e8;
    --text: #202124;
    --muted: #5f6368;
    --border: #dadce0;
    --ok: #188038;
    --warn: #b06000;
    --err: #c5221f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 12px 16px;
    font: 13px/1.45 Roboto, Arial, sans-serif;
    color: var(--text);
    background: #fff;
  }
  h3 { font-size: 13px; margin: 16px 0 6px; }
  a { color: var(--accent); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; margin-top: 4px; }
  .footer { margin-top: 24px; padding-top: 8px; border-top: 1px solid var(--border); text-align: right; }
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin: 0 -12px 10px;
    padding: 0 12px;
    position: sticky;
    top: 0;
    background: #fff;
  }
  .tab {
    border: 0;
    background: none;
    padding: 10px 10px 8px;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font: inherit;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .row { margin: 6px 0; }
  .buttons { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=password], select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font: inherit;
    margin: 4px 0;
  }
  .message {
    padding: 8px 10px;
    border-radius: 4px;
    margin-bottom: 8px;
    background: #e8f0fe;
  }
  .message.error { background: #fce8e6; color: var(--err); }
  .message.ok { background: #e6f4ea; color: var(--ok); }
  .hint { padding: 10px; background: #f1f3f4; border-radius: 4px; }
  .list { list-style: none; margin: 8px 0 0; padding: 0; }
  .list li { padding: 7px 0; border-bottom: 1px solid #f1f3f4; }
  .list .name { display: block; word-break: break-word; }
  .list .meta { font-size: 12px; color: var(--muted); }
  .status-ok { color: var(--ok); }
  .status-pending, .status-changed, .status-outdated, .status-empty { color: var(--warn); }
  .status-error { color: var(--err); }
  .status-unsupported { color: var(--muted); }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(32, 33, 36, .45);
    display: flex;
    align-items: center;
    padding: 12px;
  }
  .notice { background: #fff; border-radius: 6px; padding: 4px 14px 12px; }
</style>
