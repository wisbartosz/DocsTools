<script>
  const TO_PROCESS = ['pending', 'changed', 'outdated', 'error'];

  let settings = null;
  let sources = [];
  let assistant = { sources: [], warnChars: 0 };
  let assistantLoaded = false;
  let connection = null;
  const threads = [];
  let activeThread = null;
  let checkView = 'overview';
  let busy = false;

  function $(id) { return document.getElementById(id); }

  function t(key, params) {
    const text = I18N[key] || key;
    if (!params) return text;
    return text.replace(/\{(\w+)\}/g, (match, name) => params[name] === undefined ? match : String(params[name]));
  }

  function countText(key, count) {
    const n = Math.abs(count) % 100;
    const d = n % 10;
    const form = count === 1 ? 'one' : UI_LANG === 'pl' && d >= 2 && d <= 4 && (n < 12 || n > 14) ? 'few' : 'many';
    return t(key + '.' + form, { count: formatNumber(count) });
  }

  function formatNumber(value) {
    return value.toLocaleString(UI_LANG === 'pl' ? 'pl-PL' : 'en-US');
  }

  let ignoreQueue = Promise.resolve();

  function call(fn, ...args) {
    const send = () => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
    return fn === 'updateIgnoredIssues' ? send() : ignoreQueue.then(send);
  }

  let lastError = '';

  let toastTimer = null;

  function showMessage(text, kind) {
    if (kind === 'error') lastError = text;
    if (kind === 'ok') {
      $('message').className = 'message hidden';
      showToast(text);
      return;
    }
    hideToast();
    const box = $('message');
    box.textContent = text;
    box.className = 'message' + (kind ? ' ' + kind : '');
  }

  function showToast(text, undo) {
    const toast = $('toast');
    toast.textContent = text;
    if (undo) {
      const button = el('button', 'toast-action', t('ignore.undo'));
      button.addEventListener('click', e => {
        e.stopPropagation();
        hideToast();
        undo();
      });
      toast.append(button);
    }
    toast.classList.remove('hidden');
    scheduleToastHide(Math.min(12000, Math.max(undo ? 7000 : 4000, text.length * 60)));
  }

  function scheduleToastHide(delay) {
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      if ($('toast').matches(':hover')) scheduleToastHide(1500);
      else hideToast();
    }, delay);
  }

  function hideToast() {
    clearTimeout(toastTimer);
    $('toast').classList.add('hidden');
  }

  function hideMessage() {
    $('message').className = 'message hidden';
    hideToast();
  }

  function errorText(e) {
    return (e && e.message ? e.message : String(e)).replace(/^(Exception|Error|UserError):\s*/, '');
  }

  async function run(action) {
    if (busy) return;
    busy = true;
    const buttons = [...document.querySelectorAll('button:not(.tab):not(.rail-item), #check-type, #model-select')].filter(b => !b.classList.contains('loading') && !b.disabled);
    buttons.forEach(b => b.disabled = true);
    hideMessage();
    try {
      await action();
    } catch (e) {
      showMessage(errorText(e), 'error');
    } finally {
      buttons.forEach(b => { b.disabled = false; });
      busy = false;
      renderSettings();
      if (overviewReady) renderOverview();
    }
  }

  let overviewReady = false;

  async function runInBackground(button, action) {
    if (button.disabled || button.classList.contains('loading')) return;
    button.disabled = true;
    hideMessage();
    try {
      await action();
    } catch (e) {
      showMessage(errorText(e), 'error');
    } finally {
      button.disabled = false;
    }
  }

  let assistantPending = 0;
  let assistantUnread = 0;

  async function callGemini(button, fn, ...args) {
    if (!await confirmAiNotice()) return null;
    button.classList.add('loading');
    const counts = button.closest('#tab-assistant') !== null;
    if (counts) assistantPending++;
    renderAssistantTab();
    try {
      return await call(fn, ...args);
    } finally {
      button.classList.remove('loading');
      if (counts) assistantPending--;
      renderAssistantTab();
    }
  }

  function notifyAssistant() {
    if (!assistantTab().classList.contains('active')) assistantUnread++;
    renderAssistantTab();
  }

  function assistantTab() {
    return document.querySelector('.tab[data-tab="assistant"]');
  }

  function renderAssistantTab() {
    const tab = assistantTab();
    tab.querySelectorAll('.tab-dot, .tab-spinner').forEach(node => node.remove());
    if (assistantUnread > 0) tab.append(el('span', 'tab-dot'));
    else if (assistantPending > 0) tab.append(el('span', 'tab-spinner'));
  }

  function confirmAiNotice() {
    if (settings.aiNoticeAccepted) return Promise.resolve(true);
    return new Promise(resolve => {
      $('ai-notice').classList.remove('hidden');
      $('btn-notice-accept').disabled = false;
      $('btn-notice-cancel').disabled = false;
      $('btn-notice-accept').onclick = async () => {
        $('ai-notice').classList.add('hidden');
        settings = await call('acceptAiNotice');
        resolve(true);
      };
      $('btn-notice-cancel').onclick = () => {
        $('ai-notice').classList.add('hidden');
        resolve(false);
      };
    });
  }

  let previousTab = 'check';

  function switchTab(name) {
    const current = document.querySelector('.panel:not(.hidden)');
    if (current && current.id !== 'tab-settings' && current.id !== 'tab-' + name) previousTab = current.id.replace('tab-', '');
    document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === name));
    if (name === 'assistant') {
      assistantUnread = 0;
      renderAssistantTab();
    }
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('hidden', p.id !== 'tab-' + name));
    $('btn-feedback').classList.toggle('active', name === 'feedback');
    const lastTurn = name === 'assistant' && activeThread ? activeThread.turnsElement.lastElementChild : null;
    if (lastTurn) lastTurn.scrollIntoView({ block: 'start' });
    else scrollToTop($('tab-' + name));
    hideMessage();
    if (name === 'check') {
      if (UI_MODE === 'window' && checkView === 'rules') showCheckView(currentModule ? 'module' : 'overview');
      loadCheckRules().catch(e => showMessage(errorText(e), 'error'));
    }
    renderRail();
  }

  function scrollToTop(scroller) {
    if (UI_MODE !== 'window') window.scrollTo(0, 0);
    else if (scroller) scroller.scrollTop = 0;
  }

  function renderRail() {
    if (UI_MODE !== 'window') return;
    const checkOpen = !$('tab-check').classList.contains('hidden');
    const rulesOpen = checkOpen && checkView === 'rules';
    document.querySelector('.tab[data-tab="check"]').classList.toggle('active', checkOpen && !rulesOpen);
    $('rail-rules').classList.toggle('active', rulesOpen);
    $('rail-sections').classList.toggle('hidden', !rulesOpen);
    $('rail-threads').classList.toggle('hidden', !threads.length || $('tab-assistant').classList.contains('hidden') || $('assistant-content').classList.contains('hidden'));
  }

  function renderQuestionPlaceholder() {
    const key = fragment ? 'assistant.fragment.placeholder'
      : activeThread ? 'assistant.placeholderFollowUp'
      : 'assistant.placeholder';
    $('question').placeholder = t(key);
  }

  function markThreadUnread(thread) {
    thread.unread = true;
    renderThreadList();
  }

  function selectThread(thread, scroll) {
    activeThread = thread;
    if (thread) thread.unread = false;
    renderQuestionPlaceholder();
    renderAssistantSummary();
    threads.forEach(item => item.element.classList.toggle('active', item === thread));
    $('assistant-examples').classList.toggle('hidden', !!thread);
    $('assistant-threads').open = false;
    renderThreadList();
    if (scroll === false) return;
    if (thread) thread.element.scrollIntoView({ block: 'start' });
    else scrollToTop($('tab-assistant'));
  }

  function renderThreadList() {
    const unread = threads.some(thread => thread.unread);
    $('assistant-threads').classList.toggle('hidden', !threads.length);
    $('assistant-threads-summary').textContent = t('assistant.threadsSummary', { count: threads.length });
    $('assistant-threads').querySelector('summary').classList.toggle('has-dot', unread);
    fillThreadList($('thread-list'));
    if (UI_MODE === 'window') {
      fillThreadList($('rail-thread-list'));
      renderRail();
    }
  }

  function fillThreadList(list) {
    const hadFocus = document.activeElement && list.contains(document.activeElement);
    list.innerHTML = '';
    threads.slice().reverse().forEach(thread => {
      const button = el('button', 'rail-item rail-thread' + (thread === activeThread ? ' active' : ''));
      button.append(el('span', 'rail-thread-label', thread.label));
      if (thread.unread) button.append(el('span', 'tab-dot'));
      button.title = thread.title;
      if (thread === activeThread) button.setAttribute('aria-current', 'true');
      button.addEventListener('click', () => {
        switchTab('assistant');
        selectThread(thread);
      });
      list.append(button);
      if (hadFocus && thread === activeThread) button.focus();
    });
  }

  async function sendFeedback() {
    const button = $('btn-send-feedback');
    button.classList.add('loading');
    try {
      await call('sendFeedback', $('feedback-message').value, $('feedback-email').value, {
        lastError: lastError,
        view: UI_MODE,
        browser: navigator.userAgent,
      });
      $('feedback-message').value = '';
      showMessage(t('feedback.sent'), 'ok');
    } finally {
      button.classList.remove('loading');
    }
  }

  function renderSettings() {
    if (!settings) return;
    $('fallback-toggle').checked = settings.fallback !== false;
    $('folder-name').textContent = settings.sourceFolderName || t(settings.sourceFolderId ? 'settings.folder.noAccess' : 'settings.folder.noneShort');
    $('folder-current').textContent = settings.sourceFolderId
      ? (settings.sourceFolderName ? t('settings.folder.drive') : t('settings.folder.inaccessible'))
      : t('settings.folder.none');
    $('key-status').textContent = settings.hasApiKey ? t('settings.key.present') : t('settings.key.missing');
    $('key-status').classList.toggle('ok', !!settings.hasApiKey);
    $('connection-status').textContent = !connection ? t('settings.connection.unknown')
      : connection.ok ? t('settings.connection.ok', { time: connection.time }) : t('settings.connection.failed');
    $('btn-clear-key').disabled = busy || !settings.hasApiKey;
    $('model-select').disabled = busy || !settings.hasApiKey;
    $('btn-test').disabled = busy || !settings.hasApiKey || !settings.model;
    const hasFolder = !!(settings.sourceFolderId && settings.sourceFolderName);
    $('sources-no-folder').classList.toggle('hidden', hasFolder);
    $('sources-content').classList.toggle('hidden', !hasFolder);
    const hasFolderId = !!settings.sourceFolderId;
    if (editorState.folder !== hasFolderId) $('folder-editor').classList.toggle('hidden', hasFolderId);
    if (editorState.key !== settings.hasApiKey) $('key-editor').classList.toggle('hidden', !!settings.hasApiKey);
    editorState.folder = hasFolderId;
    editorState.key = settings.hasApiKey;
    $('btn-change-folder').textContent = t(hasFolderId ? 'settings.change' : 'settings.add');
    $('btn-change-key').textContent = t(settings.hasApiKey ? 'settings.change' : 'settings.add');
    renderAssistantStart();
  }

  const editorState = { folder: null, key: null };

  function openEditor(editor, input) {
    switchTab('settings');
    $(editor).classList.remove('hidden');
    $(input).focus();
  }

  function renderAssistantStart() {
    if (!settings) return;
    const hasFolder = !!settings.sourceFolderName;
    const hasSources = !!(assistant && assistant.sources && assistant.sources.length);
    const hasKey = !!settings.hasApiKey;
    const ready = hasFolder && hasSources && hasKey;
    $('assistant-start').classList.toggle('hidden', ready || (hasFolder && !assistantLoaded));
    $('assistant-content').classList.toggle('hidden', !ready);
    const folderDetail = t('assistant.start.folderDone', { name: settings.sourceFolderName }) + (sources.length ? ' · ' + countText('count.files', sources.length) : '');
    const keyLink = el('button', 'link inline-link', t('assistant.start.keyLink'));
    keyLink.addEventListener('click', () => openEditor('key-editor', 'key-input'));
    const keyTodo = el('span');
    const keyParts = t('assistant.start.keyTodo').split('{link}');
    keyTodo.append(keyParts[0], keyLink, keyParts[1] || '');
    const steps = [
      { done: hasFolder, title: 'assistant.start.folder', detail: hasFolder ? folderDetail : t('assistant.start.folderTodo'),
        action: 'assistant.start.folderAction', run: () => openEditor('folder-editor', 'folder-input'), hint: 'assistant.start.needFolder' },
      { done: hasSources, title: 'assistant.start.sources',
        detail: hasSources ? t('assistant.start.sourcesDone', { count: assistant.sources.length }) : t('assistant.start.sourcesTodo'),
        action: 'assistant.start.sourcesAction', needs: hasFolder, hint: 'assistant.start.needSources',
        run: () => {
          switchTab('sources');
          run(processSources);
        } },
      { done: hasKey, title: 'assistant.start.key', detail: hasKey ? t('assistant.start.keyDone') : keyTodo,
        action: 'assistant.start.keyAction', run: () => openEditor('key-editor', 'key-input'), hint: 'assistant.start.needKey' },
    ];
    renderRail();
    const current = steps.findIndex(step => !step.done && step.needs !== false);
    const pending = steps.find(step => !step.done);
    $('start-composer-text').textContent = pending ? t(pending.hint) : '';
    const list = $('start-steps');
    list.innerHTML = '';
    steps.forEach((step, i) => {
      const li = el('li', 'start-step' + (step.done ? ' done' : '') + (i === current ? ' current' : ''));
      const mark = el('span', 'start-mark', step.done ? '' : String(i + 1));
      const body = el('span', 'start-body');
      const detail = el('span', 'start-detail');
      detail.append(step.detail);
      body.append(el('span', 'start-name', t(step.title)), detail);
      if (i === current) {
        const button = el('button', 'primary start-action', t(step.action));
        button.addEventListener('click', step.run);
        body.append(button);
      }
      li.append(mark, body);
      list.append(li);
    });
  }

  function fillModels(models) {
    const select = $('model-select');
    select.innerHTML = '';
    const empty = document.createElement('option');
    empty.value = '';
    empty.textContent = models.length ? t('settings.model.choose') : t('settings.model.none');
    select.appendChild(empty);
    const groups = [
      [t('settings.model.recommended'), models.filter(m => m.recommended)],
      [t('settings.model.stable'), models.filter(m => m.stable && !m.recommended)],
      [t('settings.model.unstable'), models.filter(m => !m.stable)],
    ];
    groups.forEach(([label, list]) => {
      if (!list.length) return;
      const group = document.createElement('optgroup');
      group.label = label;
      list.forEach(m => {
        const option = document.createElement('option');
        option.value = m.id;
        option.textContent = m.label + ' (' + m.id + ')';
        group.appendChild(option);
      });
      select.appendChild(group);
    });
    if (settings.model && !models.some(m => m.id === settings.model)) {
      const option = document.createElement('option');
      option.value = settings.model;
      option.textContent = t('settings.model.unavailable', { model: settings.model });
      select.appendChild(option);
    }
    select.value = settings.model || '';
  }

  async function loadModels() {
    if (!settings.hasApiKey) return;
    try {
      fillModels(await call('listGeminiModels'));
    } catch (e) {
      fillModels([]);
      showMessage(errorText(e), 'error');
    }
  }

  function sourceState(status) {
    if (status === 'ok') return 'ok';
    if (status === 'error') return 'error';
    if (TO_PROCESS.includes(status)) return 'todo';
    return 'none';
  }

  function renderSources() {
    const list = $('sources-list');
    list.innerHTML = '';
    sources.forEach(s => {
      const row = el('div', 'module-row source-row state-' + sourceState(s.status));
      const badge = el('span', 'module-badge');
      if (s.status === 'error') badge.textContent = '!';
      const text = el('span', 'module-text');
      const name = el('a', 'module-name source-name', s.name);
      name.href = s.url;
      name.target = '_blank';
      const meta = el('span', 'module-status');
      meta.append(s.type + ' · ', el('span', 'status-' + s.status, t('status.' + s.status)));
      if (s.pages) meta.append(' · ' + t('sources.pages', { count: s.pages }));
      else if (s.chars) meta.append(' · ' + t('sources.chars', { count: formatNumber(s.chars) }));
      text.append(name, meta);
      if (s.error) text.append(el('span', 'module-status status-error', s.error));
      row.append(badge, text);
      list.append(row);
    });
    list.classList.toggle('hidden', !sources.length);
    const ready = sources.filter(s => s.status === 'ok').length;
    const todo = sources.filter(s => TO_PROCESS.includes(s.status)).length;
    $('sources-folder-name').textContent = settings.sourceFolderName || '';
    $('sources-summary').textContent = sources.length
      ? countText('count.files', sources.length) + ' · ' + (todo ? t('sources.summaryShort', { ready: ready, todo: todo }) : t('sources.allReady'))
      : t('sources.empty');
    $('process-label').textContent = todo ? t('sources.processCount', { count: todo }) : t('sources.process');
    $('btn-process').classList.toggle('primary', todo > 0);
    $('btn-process').classList.toggle('btn-tonal', !todo);
    renderAssistantStart();
  }

  async function loadSources() {
    if (!settings.sourceFolderName) return;
    sources = await call('listSources');
    renderSources();
  }

  async function loadAssistant() {
    if (!settings.sourceFolderName) {
      assistantLoaded = true;
      renderAssistantStart();
      return;
    }
    try {
      assistant = await call('getAssistantSources');
    } finally {
      assistantLoaded = true;
      renderAssistant();
    }
  }

  function renderAssistant() {
    renderAssistantStart();
    const list = $('assistant-source-list');
    list.innerHTML = '';
    assistant.sources.forEach(s => {
      const label = el('label', 'picker-row');
      const text = el('span', 'picker-text');
      text.append(el('span', 'picker-name', s.name));
      const size = s.pages ? t('sources.pages', { count: s.pages }) : s.chars ? t('sources.chars', { count: formatNumber(s.chars) }) : '';
      if (size) text.append(el('span', 'picker-meta', size));
      const box = el('input');
      box.type = 'checkbox';
      box.checked = s.selected;
      box.addEventListener('change', () => { s.selected = box.checked; selectionChanged(); });
      label.append(text, box);
      list.append(label);
    });
    renderAssistantSummary();
  }

  function renderAssistantSummary() {
    const selected = assistant.sources.filter(s => s.selected);
    const threadFragment = activeThread && activeThread.fragment ? activeThread.fragment.length : 0;
    const chars = selected.reduce((sum, s) => sum + (s.chars || 0), 0) + (fragment ? fragment.chars : threadFragment);
    $('assistant-sources-summary').textContent = t('assistant.sourcesSummary', { selected: selected.length, total: assistant.sources.length });
    $('assistant-size').textContent = t('assistant.size', { chars: formatNumber(chars) });
    $('assistant-picker-size').textContent = t('assistant.size', { chars: formatNumber(chars) });
    $('assistant-size-warning').classList.toggle('hidden', chars <= assistant.warnChars);
  }

  function selectionChanged() {
    renderAssistantSummary();
    const excluded = assistant.sources.filter(s => !s.selected).map(s => s.id);
    google.script.run.withFailureHandler(e => showMessage(errorText(e), 'error')).saveAssistantSelection(excluded);
  }

  function selectAllSources(selected) {
    assistant.sources.forEach(s => { s.selected = selected; });
    renderAssistant();
    selectionChanged();
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  let fragment = null;

  async function attachFragment() {
    fragment = await call('getSelectedFragment');
    renderFragment();
  }

  function removeFragment() {
    fragment = null;
    renderFragment();
  }

  function renderFragment() {
    $('fragment-box').classList.toggle('hidden', !fragment);
    $('fragment-title').textContent = fragment ? t('assistant.fragment.chip', { text: fragment.text.slice(0, 120) }) : '';
    $('fragment-title').title = fragment ? fragment.text : '';
    $('fragment-text').textContent = fragment ? fragment.text : '';
    $('btn-attach-fragment').textContent = t(fragment ? 'assistant.fragment.replace' : 'assistant.fragment.attach');
    renderQuestionPlaceholder();
    renderAssistantSummary();
  }

  async function askAssistant() {
    const target = activeThread;
    const attached = fragment;
    const typed = $('question').value;
    const question = typed.trim() || (attached ? t('assistant.fragment.defaultQuestion') : '');
    const selected = assistant.sources.filter(s => s.selected);
    const history = target ? target.turns.map(turn => ({ question: turn.question, answer: turn.answer })) : [];
    const fragmentText = attached ? attached.text : (target ? target.fragment : '');
    const result = await callGemini($('btn-ask'), 'askAssistant', question, selected.map(s => s.id), history, fragmentText);
    if (!result) return;
    hideMessage();
    if (fragment === attached) removeFragment();
    let thread = target;
    if (!thread) {
      thread = { fragment: fragmentText, turns: [] };
      thread.element = renderThread(thread, question);
      threads.push(thread);
      $('answers').append(thread.element);
    } else if (attached) {
      thread.fragment = attached.text;
    }
    const turn = addTurn(thread, question, result, attached ? attached.text : '', selected);
    if ($('question').value === typed) $('question').value = '';
    if (activeThread === target) {
      selectThread(thread, false);
      turn.scrollIntoView({ block: 'start' });
    } else {
      markThreadUnread(thread);
    }
    notifyAssistant();
  }

  function renderThread(thread, firstQuestion) {
    const card = el('div', 'thread');
    const title = thread.fragment ? (UI_LANG === 'pl' ? '„' : '“') + thread.fragment.slice(0, 80) + '” · ' + firstQuestion : firstQuestion;
    thread.title = title;
    thread.label = firstQuestion;
    thread.turnsElement = el('div', 'turns');
    card.append(thread.turnsElement);
    return card;
  }

  function addTurn(thread, question, result, fragmentText, selected) {
    const turn = el('div', 'turn');
    const main = el('div', 'turn-main');
    turn.append(main);
    main.append(el('div', 'bubble', question));
    if (fragmentText) {
      const box = el('details', 'thread-fragment');
      box.append(el('summary', '', t('assistant.fragment.inThread')), el('div', 'fragment-text', fragmentText));
      main.append(box);
    }
    if (selected.length < assistant.sources.length) {
      main.append(el('div', 'thread-sources', t('assistant.threadSources', { names: selected.map(s => s.name).join(', ') })));
    }
    if (result.raw) {
      main.append(el('div', 'not-found', t('assistant.rawNote')), el('p', 'raw', result.raw), ...answerNotes(result));
      thread.turns.push({ question: question, answer: result.raw });
      thread.turnsElement.append(turn);
      return turn;
    }
    if (!result.found) main.append(el('div', 'not-found', t('assistant.notFound')));
    const answer = el('div', 'answer');
    result.answer.split(/\n{2,}/).forEach(part => answer.append(answerParagraph(part.trim(), turn)));
    main.append(answer);
    if (result.citations.length) {
      turn.classList.add('has-cites');
      const cites = el('div', 'cites');
      cites.append(el('div', 'cites-title', t('assistant.citations', { count: result.citations.length })));
      const list = el('ol');
      result.citations.forEach((c, index) => list.append(renderCitation(c, index + 1)));
      cites.append(list);
      turn.append(cites);
    }
    const actions = el('div', 'turn-actions');
    const copy = el('button', 'link', t('assistant.copy'));
    copy.addEventListener('click', () => copyAnswer(result));
    actions.append(copy);
    turn.append(actions, ...answerNotes(result));
    thread.turns.push({ question: question, answer: result.answer });
    thread.turnsElement.append(turn);
    return turn;
  }

  function answerParagraph(text, turn) {
    const p = el('p');
    text.split(/(\[\d+\])/).forEach(part => {
      const match = part.match(/^\[(\d+)\]$/);
      if (!match) {
        if (part) p.append(part);
        return;
      }
      const ref = el('button', 'cite-ref', match[1]);

  function copyAnswer(result) {
    const lines = [result.answer.trim()];
    if (result.citations.length) {
      lines.push('', t('assistant.copySources'));
      result.citations.forEach((c, index) => {
        const where = c.page ? ', ' + t('assistant.page', { page: c.page }) : c.location ? ', ' + c.location : '';
        const quote = c.quote ? ' – ' + (UI_LANG === 'pl' ? '„' : '“') + c.quote + '”' : '';
        lines.push('[' + (index + 1) + '] ' + c.sourceName + where + quote);
      });
    }
    const text = lines.join('\n');
    const done = () => showMessage(t('assistant.copied'), 'ok');
    const fallback = () => {
      const area = el('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.append(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      if (ok) done();
      else showMessage(t('assistant.copyFailed'), 'error');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();

  async function processSources() {
    const progress = $('process-progress');
    progress.classList.remove('hidden');
    try {
      setProgress(progress, t('sources.cleaning'));
      const cleanup = await call('cleanupSources');
      await loadSources();
      const removedNote = cleanup.removed ? ' ' + t('sources.removedNote', { count: cleanup.removed }) : '';
      const queue = sources.filter(s => TO_PROCESS.includes(s.status));
      if (!queue.length) {
        showMessage(t('sources.allDone') + removedNote, 'ok');
        return;
      }
      let failed = 0;
      for (let i = 0; i < queue.length; i++) {
        setProgress(progress, t('sources.progress', { current: i + 1, total: queue.length, name: queue[i].name }));
        const updated = await call('processSource', queue[i].id);
        if (updated.status === 'error') failed++;
        sources = sources.map(s => s.id === updated.id ? updated : s);
        renderSources();
      }
      showMessage(
        (failed ? t('sources.doneWithErrors', { count: failed }) : t('sources.done')) + removedNote,
        failed ? 'error' : 'ok'
      );
    } finally {
      progress.classList.add('hidden');
      await loadAssistant();
    }
  }

  function makeExpandable(node, collapsedClass) {
    const collapsed = () => node.classList.contains(collapsedClass);
    const sync = () => {
      node.setAttribute('aria-expanded', collapsed() ? 'false' : 'true');

  function fixAllButton(count, handler) {
    const button = el('button', 'btn-tonal', t('typo.fixAll', { count: formatNumber(count) }));

  let pendingResultFocus = null;

  function focusFrom(node) {
    const section = node.closest('.ignored-section');
    const group = section || node.closest('.result-group');
    if (!group) return null;
    const item = node.closest('.result-item');
    const items = [...group.querySelectorAll('.result-item')];
    const part = node.classList.contains('btn-small') ? 'fix' : node.classList.contains('ignore-btn') ? 'ignore' : node.classList.contains('btn-ignore-all') ? 'ignoreAll' : 'snippet';
    return { kind: section ? '#hidden' : group.dataset.kind, index: item ? items.indexOf(item) : -1, part: part };
  }

  function rememberResultFocus(box) {
    if (pendingResultFocus) {
      const pending = pendingResultFocus;
      pendingResultFocus = null;
      return pending;
    }
    const active = document.activeElement;
    return active && box.contains(active) ? focusFrom(active) : null;
  }

  function restoreResultFocus(box, focus) {
    if (!focus) return;
    const section = box.querySelector('.ignored-section');
    const group = focus.kind === '#hidden' ? section : [...box.querySelectorAll('.result-group')].find(g => g.dataset.kind === focus.kind);
    if (!group) {
      const fallback = (focus.part === 'ignore' || focus.part === 'ignoreAll') && box.querySelector('.ignored-bar, .ignored-head button');
      if (fallback) fallback.focus();
      return;
    }
    const items = [...group.querySelectorAll('.result-item')];
    const item = focus.index >= 0 && items.length ? items[Math.min(focus.index, items.length - 1)] : null;
    const head = focus.kind === '#hidden' ? group.querySelector('.ignored-bar, .ignored-head button') : group.querySelector('.result-head');
    const target = item
      ? ((focus.part === 'fix' && item.querySelector('.btn-small')) || (focus.part === 'ignore' && item.querySelector('.ignore-btn')) || item.querySelector('.result-snippet'))
      : head;
    if (target) target.focus();
  }

  const EYE_OFF = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A9.6 9.6 0 0 1 12 5c5 0 9 4.5 10 7-.5 1.2-1.3 2.4-2.4 3.5M6.6 6.6C4.4 8 2.8 10.1 2 12c1 2.5 5 7 10 7 1.6 0 3-.4 4.3-1"/></svg>';
  const hiddenOpen = new Set();

  function hiddenItems(data) {
    return (data.groups || []).reduce((all, group) => all.concat((group.hidden || []).map(item => ({ group: group, item: item }))), []);
  }

  function hiddenCount(data) {
    return (data.groups || []).reduce((sum, group) => sum + (group.hiddenCount || 0), 0);
  }

  function hiddenEntries(data) {
    return (data.groups || []).filter(group => group.hidden && group.hidden.length)
      .map(group => ({ kind: group.kind, keys: group.hidden.map(item => item.ignoreKey) }));
  }

  function moveIgnored(data, kind, keys, hide) {
    const group = (data.groups || []).find(g => g.kind === kind);
    if (!group) return 0;
    group.hidden = group.hidden || [];
    const from = hide ? group.items : group.hidden;
    const to = hide ? group.hidden : group.items;
    const moving = from.filter(item => keys.includes(item.ignoreKey));
    const already = to.filter(item => keys.includes(item.ignoreKey)).length;
    const changed = Math.max(0, keys.length - already);
    if (moving.length) {
      const rest = from.filter(item => !moving.includes(item));
      const merged = to.concat(moving).sort((a, b) => (a.seq || 0) - (b.seq || 0));
      if (hide) {
        group.items = rest;
        group.hidden = merged;
      } else {
        group.hidden = rest;
        group.items = merged;
      }
    }
    group.count += hide ? -changed : changed;
    group.hiddenCount = (group.hiddenCount || 0) + (hide ? changed : -changed);
    if (group.allKeys) group.allKeys = hide ? group.allKeys.filter(key => !keys.includes(key)) : null;
    return changed;
  }

  function refreshModule(module) {
    runModuleCheck(module).catch(e => showMessage(errorText(e), 'error'));
  }

  function setIgnored(moduleId, entries, hide, options) {
    const opts = options || {};
    const module = moduleById(moduleId);
    const data = module.data();
    if (!data || !data.groups) return { count: 0, save: Promise.resolve({ removed: [] }) };
    const kinds = opts.all ? data.groups.filter(group => group.hiddenCount).map(group => group.kind) : null;
    let count = 0;
    entries.forEach(entry => { count += moveIgnored(data, entry.kind, entry.keys, hide); });
    if (opts.all) {
      data.groups.forEach(group => {
        count += group.hiddenCount || 0;
        group.count += group.hiddenCount || 0;
        group.hiddenCount = 0;
        group.hidden = [];
      });
    }
    module.render();
    const keys = [].concat(...entries.map(entry => entry.keys));
    const save = ignoreQueue.then(() => call('updateIgnoredIssues', moduleId, hide ? keys : [], hide ? [] : kinds ? { kinds: kinds } : keys));
    ignoreQueue = save.then(() => null, () => null);
    save.then(() => {
      if (opts.refresh) refreshModule(module);
    }, e => {
      showMessage(errorText(e), 'error');
      refreshModule(module);
    });
    return { count: count, save: save };
  }

  function rehideKeys(moduleId, keys) {
    const kinds = {};
    keys.forEach(key => { (kinds[key.split(':')[0]] = kinds[key.split(':')[0]] || []).push(key); });
    const entries = Object.keys(kinds).map(kind => ({ kind: kind, keys: kinds[kind] }));
    if (entries.length) setIgnored(moduleId, entries, true, { refresh: true });
  }

  function ignoreIssues(moduleId, kind, keys) {
    const entries = [{ kind: kind, keys: keys }];
    const result = setIgnored(moduleId, entries, true);
    if (result.count) showToast(countText('ignore.done', result.count), () => setIgnored(moduleId, entries, false));
  }

  function restoreIssues(moduleId, entries, all) {
    const result = setIgnored(moduleId, entries, false, { all: all });
    if (!result.count) return;
    showToast(countText('ignore.restored', result.count), all
      ? () => result.save.then(r => rehideKeys(moduleId, r.removed)).catch(() => null)
      : () => setIgnored(moduleId, entries, true));
  }

  function restoreAllIgnored() {
    const done = [];
    let count = 0;
    CHECK_MODULES.forEach(module => {
      const data = module.data();
      if (!data || !data.groups || !hiddenCount(data)) return;
      const result = setIgnored(module.id, hiddenEntries(data), false, { all: true });
      count += result.count;
      done.push({ id: module.id, save: result.save });
    });
    if (count) {
      showToast(countText('ignore.restored', count), () => done.forEach(d => d.save.then(r => rehideKeys(d.id, r.removed)).catch(() => null)));
    }
  }

  function toggleHidden(spec, open) {
    if (open) hiddenOpen.add(spec.module);
    else hiddenOpen.delete(spec.module);
    pendingResultFocus = { kind: '#hidden', index: -1, part: 'head' };

  function renderHiddenSection(spec, hidden, total) {
    const section = el('section', 'ignored-section');
    if (!hiddenOpen.has(spec.module)) {
      const bar = el('button', 'ignored-bar');
      bar.innerHTML = EYE_OFF;
      bar.append(el('span', 'ignored-text', countText('ignore.bar', total)), el('span', 'ignored-show', t('ignore.show')));
      bar.addEventListener('click', () => toggleHidden(spec, true));
      section.append(bar);
      return section;
    }
    section.classList.add('open');
    const head = el('div', 'ignored-head');
    head.innerHTML = EYE_OFF;
    const collapse = el('button', 'link', t('ignore.hide'));
    collapse.addEventListener('click', () => toggleHidden(spec, false));
    head.append(el('span', 'ignored-title', t('ignore.title')), el('span', 'result-count', formatNumber(total)), collapse);
    section.append(head, el('div', 'result-desc', t('ignore.desc')));
    if (total > hidden.length) section.append(el('div', 'result-desc', t(spec.moreKey || 'bib.more', { shown: hidden.length, count: formatNumber(total) })));
    const list = el('ul', 'result-list');
    hidden.forEach(entry => list.append(renderResultItem(spec, entry.item, entry.group, true)));
    section.append(list);
    const all = el('button', 'btn-tonal', t('ignore.restoreAll', { count: formatNumber(total) }));
    all.addEventListener('click', () => {
      if (busy) return;
      restoreIssues(spec.module, hiddenEntries(spec.data()), true);
    });
    const row = el('div', 'row buttons');
    row.append(all);
    section.append(row);
    return section;
  }

  function renderCheckResult(spec) {
    const data = spec.data();
    const summary = $(spec.summaryId);
    const box = $(spec.groupsId);
    const focus = rememberResultFocus(box);
    summary.classList.remove('hidden');
    box.innerHTML = '';
    const empty = spec.empty ? spec.empty(data) : '';
    if (empty) {
      if (spec.module) delete moduleErrors[spec.module];
      summary.textContent = empty;
      renderFilters();
      renderOverview();
      return;
    }
    const groups = data.groups.filter(g => g.count > 0);
    const notes = spec.notes ? spec.notes(data) : [];
    summary.textContent = groups.length ? '' : t(spec.noneKey);
    notes.forEach(text => summary.append(el('div', 'result-note', text)));
    summary.classList.toggle('hidden', groups.length > 0 && !notes.length);
    if (spec.module && openFirstGroup[spec.module]) {
      delete openFirstGroup[spec.module];
      if (!spec.open.size && groups.length) spec.open.add(groups[0].kind);
    }
    if (spec.module) delete moduleErrors[spec.module];
    const filtered = spec.module && spec.module === currentModule;
    if (filtered && resultFilter !== 'all' && !groups.some(group => (resultFilter === 'review') === !!group.info)) resultFilter = 'all';
    groups
      .filter(group => !filtered || resultFilter === 'all' || (resultFilter === 'review') === !!group.info)
      .forEach(group => box.append(renderResultGroup(spec, group)));
    const hidden = spec.module ? hiddenItems(data) : [];
    if (hidden.length && (!filtered || resultFilter !== 'fix')) box.append(renderHiddenSection(spec, hidden, hiddenCount(data)));
    restoreResultFocus(box, focus);
    renderFilters();
    renderOverview();
  }

  function renderResultGroup(spec, group) {
    const card = el('details', 'result-group');
    card.dataset.kind = group.kind;
    card.open = spec.open.has(group.kind);
    card.addEventListener('toggle', () => card.open ? spec.open.add(group.kind) : spec.open.delete(group.kind));
    const head = el('summary', 'result-head');
    const level = group.info ? 'review' : 'fix';
    const mark = el('span', 'sev sev-' + level);
    mark.title = level === 'review' ? t('check.level.review') : t('check.level.fix');
    mark.setAttribute('role', 'img');
    mark.setAttribute('aria-label', mark.title);
    head.append(mark, el('span', 'result-title', t(spec.kindKey + group.kind + '.title')), infoTip(t(spec.kindKey + group.kind + '.desc')), el('span', 'result-count', formatNumber(group.count)));
    card.append(head);
    const actions = spec.groupActions ? spec.groupActions(group) : [];
    const ignorable = !group.info || !spec.module ? [] : group.allKeys || group.items.filter(item => item.ignoreKey).map(item => item.ignoreKey);
    if (ignorable.length > 1) {
      const ignoreAll = el('button', 'btn-ignore-all');
      ignoreAll.innerHTML = EYE_OFF;
      ignoreAll.append(t('ignore.all', { count: formatNumber(ignorable.length) }));
      ignoreAll.addEventListener('click', () => {
        if (busy) return;
        pendingResultFocus = focusFrom(ignoreAll);
        ignoreIssues(spec.module, group.kind, ignorable);
      });
      actions.push(ignoreAll);
    }
    if (actions.length) {
      const row = el('div', 'row buttons');
      actions.forEach(action => row.append(action));
      card.append(row);
    }
    if (group.count > group.items.length) {
      card.append(el('div', 'result-desc', t(spec.moreKey || 'bib.more', { shown: group.items.length, count: formatNumber(group.count) })));
    }
    const list = el('ul', 'result-list');
    group.items.forEach(item => list.append(renderResultItem(spec, item, group)));
    card.append(list);
    return card;
  }

  function renderResultItem(spec, item, group, hidden) {
    const li = el('li', 'result-item' + (hidden ? ' ignored' : ''));
    const showable = spec.showable ? spec.showable(item) : item.showable;
    const snippet = el('div', 'result-snippet' + (showable ? '' : ' static'));
    if (spec.snippet) {
      spec.snippet(item, snippet);
    } else if (typeof item.replacement === 'string') {
      const change = el('div', 'fix-change');
      change.append(el('span', 'fix-before', item.preview), el('span', 'fix-arrow', '→'), el('span', 'fix-after', item.replacement));
      snippet.append(change);
    } else {
      snippet.append(el('div', '', item.preview));
      if (item.detail) snippet.append(el('div', 'result-detail', item.detail));
    }
    if (showable) {
      snippet.title = t('typo.show');
      snippet.tabIndex = 0;

  async function fixTypographyIssue(item) {
    const update = await call('fixTypographyIssue', item.ref);
    update.items.forEach(fresh => { fresh.order = item.order; });
    typo.groups.forEach(group => {
      group.count += (update.after[group.kind] || 0) - (update.before[group.kind] || 0);
      group.items = group.items
        .filter(other => other.ref.key !== update.key)
        .concat(update.items.filter(fresh => fresh.ref.kind === group.kind))
        .sort((a, b) => a.order - b.order || a.ref.start - b.ref.start);
    });
    renderTypography();
  }

  function setRuleInput(path, value) {
    const input = path.indexOf('structure.') === 0 ? $(STRUCTURE_FIELDS[path.slice(10)]) : $(RULE_FIELDS[path]);
    if (!input) return;
    if (input.type === 'checkbox') input.checked = value === true || value === 'true';
    else if (value === null || value === undefined) input.value = '';
    else input.value = input.type === 'number' ? String(value).replace(',', '.').replace(/[^\d.]/g, '') : value;
  }

  function ruleLabel(path) {
    const [group, key] = path.split('.');
    if (group === 'structure') {
      const labels = {
        sectionsReview: t('structure.rules.title') + ': ' + t('structure.type.review'),
        sectionsResearch: t('structure.rules.title') + ': ' + t('structure.type.research'),
        toc: t('structure.rules.toc'),
        numbering: t('structure.rules.numbering'),
        keywordsMin: t('structure.rules.keywords') + ': ' + t('structure.from'),
        keywordsMax: t('structure.rules.keywords') + ': ' + t('structure.to'),
        abstractMin: t('structure.rules.abstract') + ': ' + t('structure.from'),
        abstractMax: t('structure.rules.abstract') + ': ' + t('structure.to'),
        aimMin: t('structure.rules.aim') + ': ' + t('structure.from'),
        aimMax: t('structure.rules.aim') + ': ' + t('structure.to'),
        minPages: t('structure.rules.minPages'),
      };
      return labels[key] || path;
    }
    if (path === 'size') return t('format.rules.text') + ': ' + t('format.rules.size');
    if (group === 'margins') return t('format.rules.margins') + ': ' + t('format.rules.' + key);
    if (group === 'heading1' || group === 'heading2') {
      const name = key === 'size' ? 'format.rules.size' : key === 'bold' ? 'format.rules.bold' : 'format.rules.uppercase';
      return t('format.rules.' + group) + ': ' + t(name);
    }
    return t('format.rules.' + group);

  function hideListPreview() {
    $('fig-list').classList.add('hidden');

  function listToggle(title, hint, checked, disabled) {
    const label = el('label', 'picker-row');
    const text = el('span', 'picker-text');
    text.append(el('span', 'picker-name', title), el('span', 'picker-meta', hint));
    const box = el('input');

    box.checked = checked;
    box.disabled = disabled;

  function renderListPreview(preview) {
    const card = $('fig-list');
    card.innerHTML = '';
    card.append(el('div', 'renumber-title', t('fig.list.heading')));
    card.append(el('div', 'small', t('fig.list.place.' + preview.place, { count: preview.existing })));
    if (!preview.entries.length) card.append(el('div', 'renumber-warn small', t('err.figListEmpty')));
    const list = el('div', 'list-preview');
    preview.entries.forEach(entry => {
      const row = el('div', 'list-preview-row');
      row.append(el('span', 'list-preview-text', entry.text), el('span', 'list-preview-page', entry.page ? t('fig.list.pageApprox', { page: entry.page }) : '–'));
      list.append(row);
    });
    card.append(list);
    const toggles = el('div', 'list-toggles');
    const pages = listToggle(t('fig.list.pages'), t(preview.pages ? 'fig.list.pagesHint' : 'fig.list.pagesNone'), preview.pages, !preview.pages);
    const links = listToggle(t('fig.list.links'), t('fig.list.linksHint'), true, false);
    pages.box.addEventListener('change', () => list.classList.toggle('no-pages', !pages.box.checked));
    toggles.append(pages.label, links.label);
    card.append(toggles);
    const actions = el('div', 'renumber-actions');
    const apply = el('button', 'primary', t(preview.place === 'replace' ? 'fig.list.replace' : 'fig.list.insert'));
    apply.disabled = !preview.entries.length;
    apply.addEventListener('click', () => run(async () => {
      apply.classList.add('loading');
      try {
        const response = await call('insertFigureList', { type: $('check-type').value }, { pages: pages.box.checked, links: links.box.checked });
        hideListPreview();
        figures = response.result;
        renderFigures();
        showMessage(t('fig.list.done', { count: response.count }) + (response.pages ? ' ' + t('fig.list.pagesHint') + '.' : '') + ' ' + t('typo.versionHint'), 'ok');
      } finally {
        apply.classList.remove('loading');
      }
    }));
    const cancel = el('button', 'link', t('fig.renumber.cancel'));
    cancel.addEventListener('click', hideListPreview);
    actions.append(apply, cancel);
    card.append(actions);
    card.classList.remove('hidden');
    card.scrollIntoView({ block: 'nearest' });
    apply.disabled ? cancel.focus() : apply.focus();
  }

  function hideRenumberPreview() {
    $('fig-renumber').classList.add('hidden');
    $('fig-renumber').innerHTML = '';
  }

  function renderRenumberPreview(preview) {
    const card = $('fig-renumber');
    card.innerHTML = '';
    const pending = preview.changes.length + preview.entryCount;
    if (!pending && !preview.unresolved.length && !preview.conflicts.length) {
      hideRenumberPreview();
      showMessage(t('fig.renumber.none'), 'ok');
      return false;
    }
    card.append(el('div', 'renumber-title', t('fig.renumber.title')));
    if (preview.changes.length) {
      const list = el('ul', 'renumber-list');
      preview.changes.slice(0, 12).forEach(change => {
        const li = el('li');
        li.append(el('span', 'renumber-label', change.label + ' '), el('span', 'fix-before', change.from), el('span', 'renumber-arrow', ' → '), el('span', 'fix-after', change.to));
        list.append(li);
      });
      if (preview.changes.length > 12) list.append(el('li', 'muted', t('fig.renumber.more', { count: preview.changes.length - 12 })));
      card.append(list);
    }
    const notes = [];
    if (preview.refCount) notes.push(t('fig.renumber.refs', { count: preview.refCount }));
    if (preview.entryCount) notes.push(t('fig.renumber.entries', { count: preview.entryCount }));
    if (notes.length) card.append(el('div', 'muted small', notes.join(' ')));
    preview.conflicts.forEach(label => card.append(el('div', 'renumber-warn small', t('fig.renumber.conflict', { label: label }))));
    if (preview.unresolved.length) {
      card.append(el('div', 'renumber-subtitle small', t('fig.renumber.unresolvedTitle')));
      const list = el('ul', 'renumber-unresolved small');
      preview.unresolved.slice(0, 8).forEach(item => {
        const li = el('li');
        li.append(el('span', 'renumber-raw', item.raw), ' – ' + t('fig.renumber.reason.' + item.reason, { number: item.number }));
        list.append(li);
      });
      if (preview.unresolved.length > 8) list.append(el('li', 'muted', t('fig.renumber.more', { count: preview.unresolved.length - 8 })));
      card.append(list);
    }
    const actions = el('div', 'renumber-actions');
    const apply = el('button', 'primary', t('fig.renumber.apply'));
    apply.disabled = !pending;
    apply.addEventListener('click', () => run(async () => {
      apply.classList.add('loading');
      try {
        const response = await call('renumberFigures', { type: $('check-type').value }, preview.fingerprint);
        if (response.stale) {
          if (renderRenumberPreview(response.preview)) showMessage(t('fig.renumber.stale'), 'warn');
          return;
        }
        hideRenumberPreview();
        figures = response.result;
        renderFigures();
        showMessage(t('fig.renumber.done', { captions: response.captions, refs: response.refs, entries: response.entries }) + ' ' + t('typo.versionHint'), 'ok');
      } finally {
        apply.classList.remove('loading');
      }
    }));
    const cancel = el('button', 'link', t('fig.renumber.cancel'));
    cancel.addEventListener('click', hideRenumberPreview);
    actions.append(apply, cancel);
    card.append(actions);
    card.classList.remove('hidden');
    card.scrollIntoView({ block: 'nearest' });
    apply.disabled ? cancel.focus() : apply.focus();
    return true;
  }

  function renderFigures() {
    renderCheckResult(FIGURES_SPEC);

  const CHECK_MODULES = [
    { id: 'structure', title: 'structure.title', kindKey: 'structure.kind.', data: () => structure, check: () => checkStructure(), render: () => renderStructure() },
    { id: 'bibliography', title: 'bib.title', kindKey: 'bib.kind.', data: () => bibliography, check: () => checkBibliography(), render: () => renderBibliography(),
      unavailable: data => (data.noSection ? t('check.module.noBibliography') : '') },
    { id: 'figures', title: 'fig.title', kindKey: 'fig.kind.', data: () => figures, check: () => checkFigures(), render: () => renderFigures() },
    { id: 'style', title: 'style.title', kindKey: 'style.kind.', data: () => style, check: () => checkStyle(), render: () => renderStyle() },
    { id: 'abbreviations', title: 'abbr.title', kindKey: 'abbr.kind.', data: () => abbreviations, check: () => checkAbbreviations(), render: () => renderAbbreviations() },
    { id: 'typography', title: 'typo.title', kindKey: 'typo.kind.', data: () => typo, check: () => checkTypography(), render: () => renderTypography() },
    { id: 'format', title: 'format.title', kindKey: 'format.kind.', data: () => format, check: () => checkFormatting(), render: () => renderFormatting() },
  ];
  const moduleErrors = {};
  let currentModule = null;
  let resultFilter = 'all';
  let lastCheck = null;

  function moduleById(id) {
    return CHECK_MODULES.find(m => m.id === id);
  }

  function moduleStatus(module) {
    if (moduleErrors[module.id]) return { state: 'error', fix: 0, review: 0, text: t('check.module.error', { error: moduleErrors[module.id] }) };
    const data = module.data();
    if (!data) return { state: 'none', fix: 0, review: 0, text: t('check.module.none') };
    const unavailable = module.unavailable ? module.unavailable(data) : '';
    if (unavailable) return { state: 'unavailable', fix: 0, review: 0, text: unavailable };
    const groups = data.groups.filter(g => g.count > 0);
    const fix = groups.filter(g => !g.info).reduce((sum, g) => sum + g.count, 0);
    const review = groups.filter(g => g.info).reduce((sum, g) => sum + g.count, 0);
    const hidden = hiddenCount(data);
    const withHidden = text => (hidden ? text + ' · ' + countText('ignore.count', hidden) : text);
    if (!fix && !review) return { state: 'ok', fix: 0, review: 0, hidden: hidden, text: withHidden(t('check.module.ok')) };
    if (!fix) return { state: 'review', fix: 0, review: review, hidden: hidden, text: withHidden(t('check.module.review', { count: formatNumber(review) })) };
    const top = groups.filter(g => !g.info).sort((a, b) => b.count - a.count).slice(0, 2).map(g => t(module.kindKey + g.kind + '.title'));
    const extra = review ? [t('check.module.moreReview', { count: formatNumber(review) })] : [];
    return { state: 'fix', fix: fix, review: review, hidden: hidden, text: withHidden(top.concat(extra).join(' · ')) };
  }

  function renderOverview() {
    const list = $('module-list');
    const focused = document.activeElement && document.activeElement.classList.contains('module-row') ? document.activeElement.dataset.module : null;
    list.innerHTML = '';
    let fix = 0;
    let review = 0;
    let ok = 0;
    let checked = 0;
    let hidden = 0;
    let hiddenModules = 0;
    CHECK_MODULES.forEach(module => {
      const status = moduleStatus(module);
      if (status.state !== 'none') checked++;
      if (status.hidden) {
        hidden += status.hidden;
        hiddenModules++;
      }
      fix += status.fix;
      review += status.review;
      if (status.state === 'ok') ok++;
      const selected = UI_MODE === 'window' && module.id === currentModule;
      const row = el('button', 'module-row state-' + status.state + (selected ? ' selected' : ''));
      row.dataset.module = module.id;
      if (selected) row.setAttribute('aria-current', 'true');
      row.disabled = busy;
      const badge = el('span', 'module-badge');
      if (status.state === 'fix') badge.textContent = status.fix > 99 ? '99+' : String(status.fix);
      if (status.state === 'review') badge.textContent = status.review > 99 ? '99+' : String(status.review);
      if (status.state === 'error') badge.textContent = '!';
      const text = el('span', 'module-text');
      text.append(el('span', 'module-name', t(module.title)), el('span', 'module-status', status.text));
      row.append(badge, text, el('span', 'module-chevron'));
      row.addEventListener('click', () => openModule(module.id));
      list.append(row);
    });
    $('check-counters').classList.toggle('hidden', !checked);
    $('count-fix').textContent = formatNumber(fix);
    $('count-review').textContent = formatNumber(review);
    $('count-ok').textContent = formatNumber(ok);
    $('count-hidden').classList.toggle('hidden', !hidden);
    $('count-hidden-text').textContent = hidden ? countText('ignore.plus', hidden) : '';
    $('ignored-note').classList.toggle('hidden', !hidden);
    $('ignored-note-text').textContent = hidden ? t('ignore.note', { count: formatNumber(hidden), modules: countText('ignore.modules', hiddenModules) }) : '';
    $('title-page-note').classList.toggle('hidden', !$('skip-title-page').checked);
    $('check-last').textContent = lastCheck ? t('check.last', { time: lastCheck.time, seconds: lastCheck.seconds }) : '';
    overviewReady = true;
    const row = focused && list.querySelector('.module-row[data-module="' + focused + '"]');
    if (row && !row.disabled) row.focus();
  }

  function showCheckView(name) {
    const previous = currentModule;
    const wide = UI_MODE === 'window';
    checkView = name;
    ['overview', 'module', 'rules'].forEach(view => {
      const visible = view === name || (wide && name !== 'rules' && view !== 'rules');
      $('check-' + view).classList.toggle('hidden', !visible);
    });
    scrollToTop($('check-' + name));
    renderRail();
    if (wide) {
      $('check-module').classList.toggle('empty', !currentModule);
      if (name === 'overview') renderOverview();
      return;
    }
    if (name === 'overview') {
      currentModule = null;
      renderOverview();
      const row = previous && document.querySelector('.module-row[data-module="' + previous + '"]');
      if (row) row.focus();
      return;
    }
    const back = $('check-' + name).querySelector('.btn-view-back');
    if (back) back.focus();
  }

  function renderModuleError() {
    const box = $('module-error');
    const error = currentModule && moduleErrors[currentModule];
    box.textContent = error ? t('check.module.error', { error: error }) : '';
    box.classList.toggle('hidden', !error);
  }

  function openModule(id) {
    const module = moduleById(id);
    currentModule = id;
    resultFilter = 'all';
    $('module-title').textContent = t(module.title);
    const hint = document.querySelector('.module-view[data-module="' + id + '"] .module-hint');
    setInfoTip($('module-info'), hint ? hint.textContent.trim() : '');
    document.querySelectorAll('.module-view').forEach(view => view.classList.toggle('hidden', view.dataset.module !== id));
    showCheckView('module');
    if (UI_MODE === 'window') renderOverview();
    renderModuleError();
    if (module.data()) module.render();
    else renderFilters();
    if (!module.data()) run(() => runModuleCheck(module));
  }

  async function runModuleCheck(module) {
    delete moduleErrors[module.id];
    openFirstGroup[module.id] = true;
    const spinner = currentModule === module.id ? $('btn-module-recheck') : null;
    if (spinner) spinner.classList.add('loading');
    try {
      await module.check();
    } catch (e) {
      moduleErrors[module.id] = errorText(e);
      delete openFirstGroup[module.id];
      throw e;
    } finally {
      if (spinner) spinner.classList.remove('loading');
      if (currentModule === module.id) {
        renderModuleError();
        renderFilters();
        if (document.activeElement === document.body) setTimeout(() => {
          const target = UI_MODE === 'window'
            ? document.querySelector('.module-row[data-module="' + module.id + '"]')
            : $('check-module').querySelector('.btn-view-back');
          if (document.activeElement === document.body && target && !target.disabled) target.focus();
        }, 0);
      }
      renderOverview();
    }
  }

  async function checkAll() {
    const button = $('btn-check-all');
    const started = Date.now();
    button.classList.add('loading');
    try {
      await loadCheckRules().catch(e => console.warn(e));
      for (let i = 0; i < CHECK_MODULES.length; i++) {
        const module = CHECK_MODULES[i];
        $('check-all-label').textContent = t('check.progress', { name: t(module.title), n: i + 1, total: CHECK_MODULES.length });
        try {
          await runModuleCheck(module);
        } catch (e) {
          console.warn(e);
        }
      }
      const now = new Date();
      lastCheck = {
        time: now.toLocaleTimeString(UI_LANG === 'en' ? 'en-GB' : 'pl-PL', { hour: '2-digit', minute: '2-digit' }),
        seconds: Math.round((Date.now() - started) / 1000),
      };
    } finally {
      button.classList.remove('loading');
      $('check-all-label').textContent = t('check.all');
      renderOverview();
    }
  }

  function renderFilters() {
    const box = $('module-filters');
    box.innerHTML = '';
    const module = currentModule && moduleById(currentModule);
    const data = module && module.data();
    if (!data || !data.groups) return;
    const status = moduleStatus(module);
    if (status.state === 'unavailable' || status.state === 'ok' || status.state === 'error') return;
    [['all', status.fix + status.review], ['fix', status.fix], ['review', status.review]].forEach(([key, count]) => {
      if (key !== 'all' && !count) return;
      const chip = el('button', 'filter-chip' + (resultFilter === key ? ' active' : ''), t('check.filter.' + key, { count: formatNumber(count) }));
      chip.setAttribute('aria-pressed', resultFilter === key ? 'true' : 'false');
      chip.addEventListener('click', () => {
        resultFilter = key;
        module.render();
      });
      box.append(chip);
    });
  }

  async function changeCheckType() {
    const type = $('check-type').value;
    const previousType = $('srule-type').value;
    const previousSections = $('srule-sections').value;
    $('srule-type').value = type;
    structureTypeChanged();
    const sections = $('srule-sections').value;
    try {
      await call('saveStructureType', type, sections !== previousSections ? sections : null);

      $('srule-type').value = previousType;
      $('srule-sections').value = previousSections;
      $('check-type').value = previousType;
      throw e;

    for (const id of ['structure', 'bibliography', 'figures']) {
      const module = moduleById(id);
      if (!module.data()) continue;
      try {
        await runModuleCheck(module);

  $('btn-check-typo').addEventListener('click', () => run(checkTypography));
  $('btn-attach-fragment').addEventListener('click', () => runInBackground($('btn-attach-fragment'), attachFragment));
  $('btn-remove-fragment').addEventListener('click', removeFragment);
  $('btn-feedback').addEventListener('click', () => switchTab('feedback'));
  $('btn-send-feedback').addEventListener('click', () => runInBackground($('btn-send-feedback'), sendFeedback));

  $('btn-select-all').addEventListener('click', () => selectAllSources(true));
  document.addEventListener('click', e => {
    document.querySelectorAll('.assistant-bar details[open]').forEach(details => {
      if (!details.contains(e.target)) details.open = false;
    });
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.assistant-bar details[open]').forEach(details => {
      details.open = false;
      details.querySelector('summary').focus();
    });
  });
  $('btn-new-thread').addEventListener('click', () => {
    selectThread(null);
    $('question').focus();
  });
  document.querySelectorAll('.example-chip').forEach(chip => chip.addEventListener('click', () => {
    $('question').value = chip.textContent;
    $('question').focus();
  }));
  $('btn-select-none').addEventListener('click', () => selectAllSources(false));
  $('btn-ask').addEventListener('click', () => runInBackground($('btn-ask'), askAssistant));
  if ($('btn-enlarge')) $('btn-enlarge').addEventListener('click', () => run(() => call('showAssistantWindow')));
  $('question').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      runInBackground($('btn-ask'), askAssistant);
    }
  });

  $('toast').addEventListener('click', hideToast);
  $('btn-restore-ignored').addEventListener('click', () => {
    if (!busy) restoreAllIgnored();
  });
  document.querySelectorAll('.rules-grid .rules-check').forEach(label => {
    const node = [...label.childNodes].find(child => child.nodeType === 3 && child.textContent.trim());
    if (node) node.textContent = node.textContent.replace(/\S/, ch => ch.toLocaleUpperCase(UI_LANG));
  });
  document.querySelectorAll('.rules-pane input[type=number], .rules-pane input[type=text]').forEach(input => {
    if (!input.placeholder) input.placeholder = t('rules.none');
  });
  if (UI_MODE === 'window') {
    $('rail-rules').addEventListener('click', () => {
      switchTab('check');
      showCheckView('rules');
    });
    document.querySelectorAll('#rail-sections .rail-link').forEach(link => link.addEventListener('click', () => {
      const pane = document.querySelector('.rules-pane[data-pane="' + link.dataset.pane + '"]');
      pane.scrollIntoView({ block: 'nearest' });
      pane.classList.remove('pane-flash');
      void pane.offsetWidth;
      pane.classList.add('pane-flash');
    }));
    showCheckView('overview');
    switchTab('assistant');
  }
  run(async () => {
    settings = await call('getSettings');
    $('language-select').value = settings.uiLanguageSetting || '';
    $('link-installer').href = settings.updateUrl;
    checkForUpdate(false);
    renderSettings();
    await loadCheckRules().catch(e => showMessage(errorText(e), 'error'));
  }).then(() => Promise.all([loadSources(), loadModels(), loadAssistant()]).catch(e => showMessage(errorText(e), 'error')));
  renderOverview();
</script>
