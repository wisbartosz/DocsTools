<script>
  const TO_PROCESS = ['pending', 'changed', 'outdated', 'error'];

  let settings = null;
  let sources = [];
  let assistant = { sources: [], warnChars: 0 };
  let busy = false;

  function $(id) { return document.getElementById(id); }

  function t(key, params) {
    const text = I18N[key] || key;
    if (!params) return text;
    return text.replace(/\{(\w+)\}/g, (match, name) => params[name] === undefined ? match : String(params[name]));
  }

  function formatNumber(value) {
    return value.toLocaleString(UI_LANG === 'pl' ? 'pl-PL' : 'en-US');
  }

  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }

  let lastError = '';

  function showMessage(text, kind) {
    if (kind === 'error') lastError = text;
    const box = $('message');
    box.textContent = text;
    box.className = 'message' + (kind ? ' ' + kind : '');
  }

  function hideMessage() { $('message').className = 'message hidden'; }

  function errorText(e) {
    return (e && e.message ? e.message : String(e)).replace(/^(Exception|Error|UserError):\s*/, '');
  }

  async function run(action) {
    if (busy) return;
    busy = true;
    const buttons = [...document.querySelectorAll('button:not(.tab)')].filter(b => !b.classList.contains('loading'));
    buttons.forEach(b => b.disabled = true);
    hideMessage();
    try {
      await action();
    } catch (e) {
      showMessage(errorText(e), 'error');
    } finally {
      buttons.forEach(b => b.disabled = false);
      busy = false;
      renderSettings();
    }
  }

  async function runInBackground(button, action) {
    if (button.disabled || button.classList.contains('loading')) return;
    button.disabled = true;
    hideMessage();
    try {
      await action();
    } catch (e) {
      showMessage(errorText(e), 'error');
    } finally {
      button.disabled = false;
    }
  }

  let assistantPending = 0;
  let assistantUnread = 0;

  async function callGemini(button, fn, ...args) {
    if (!await confirmAiNotice()) return null;
    button.classList.add('loading');
    const counts = button.closest('#tab-assistant') !== null;
    if (counts) assistantPending++;
    renderAssistantTab();
    try {
      return await call(fn, ...args);
    } finally {
      button.classList.remove('loading');
      if (counts) assistantPending--;
      renderAssistantTab();
    }
  }

  function notifyAssistant() {
    if (!assistantTab().classList.contains('active')) assistantUnread++;
    renderAssistantTab();
  }

  function assistantTab() {
    return document.querySelector('.tab[data-tab="assistant"]');
  }

  function renderAssistantTab() {
    const tab = assistantTab();
    tab.querySelectorAll('.tab-dot, .tab-spinner').forEach(node => node.remove());
    if (assistantUnread > 0) tab.append(el('span', 'tab-dot'));
    else if (assistantPending > 0) tab.append(el('span', 'tab-spinner'));
  }

  function confirmAiNotice() {
    if (settings.aiNoticeAccepted) return Promise.resolve(true);
    return new Promise(resolve => {
      $('ai-notice').classList.remove('hidden');
      $('btn-notice-accept').disabled = false;
      $('btn-notice-cancel').disabled = false;
      $('btn-notice-accept').onclick = async () => {
        $('ai-notice').classList.add('hidden');
        settings = await call('acceptAiNotice');
        resolve(true);
      };
      $('btn-notice-cancel').onclick = () => {
        $('ai-notice').classList.add('hidden');
        resolve(false);
      };
    });
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === name));
    if (name === 'assistant') {
      assistantUnread = 0;
      renderAssistantTab();
    }
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('hidden', p.id !== 'tab-' + name));
    $('btn-feedback').classList.toggle('active', name === 'feedback');
    hideMessage();
    if (name === 'check' && !formatRulesLoaded) {
      Promise.all([loadFormatRules(), loadStructureRules()]).catch(e => showMessage(errorText(e), 'error'));
    }
  }

  async function sendFeedback() {
    const button = $('btn-send-feedback');
    button.classList.add('loading');
    try {
      await call('sendFeedback', $('feedback-message').value, $('feedback-email').value, {
        lastError: lastError,
        view: UI_MODE,
        browser: navigator.userAgent,
      });
      $('feedback-message').value = '';
      showMessage(t('feedback.sent'), 'ok');
    } finally {
      button.classList.remove('loading');
    }
  }

  function renderSettings() {
    if (!settings) return;
    $('folder-current').textContent = settings.sourceFolderId
      ? (settings.sourceFolderName ? t('settings.folder.current', { name: settings.sourceFolderName }) : t('settings.folder.inaccessible'))
      : t('settings.folder.none');
    $('key-status').textContent = settings.hasApiKey ? t('settings.key.present') : t('settings.key.missing');
    $('btn-clear-key').disabled = busy || !settings.hasApiKey;
    $('model-select').disabled = busy || !settings.hasApiKey;
    $('btn-save-model').disabled = busy || !settings.hasApiKey;
    $('btn-test').disabled = busy || !settings.hasApiKey || !settings.model;
    const hasFolder = !!(settings.sourceFolderId && settings.sourceFolderName);
    $('sources-no-folder').classList.toggle('hidden', hasFolder);
    $('sources-content').classList.toggle('hidden', !hasFolder);
  }

  function fillModels(models) {
    const select = $('model-select');
    select.innerHTML = '';
    const empty = document.createElement('option');
    empty.value = '';
    empty.textContent = models.length ? t('settings.model.choose') : t('settings.model.none');
    select.appendChild(empty);
    models.forEach(m => {
      const option = document.createElement('option');
      option.value = m.id;
      option.textContent = m.label + ' (' + m.id + ')';
      select.appendChild(option);
    });
    if (settings.model && !models.some(m => m.id === settings.model)) {
      const option = document.createElement('option');
      option.value = settings.model;
      option.textContent = t('settings.model.unavailable', { model: settings.model });
      select.appendChild(option);
    }
    select.value = settings.model || '';
  }

  async function loadModels() {
    if (!settings.hasApiKey) return;
    try {
      fillModels(await call('listGeminiModels'));
    } catch (e) {
      fillModels([]);
      showMessage(errorText(e), 'error');
    }
  }

  function renderSources() {
    const list = $('sources-list');
    list.innerHTML = '';
    sources.forEach(s => {
      const li = document.createElement('li');
      const name = document.createElement('a');
      name.className = 'name';
      name.href = s.url;
      name.target = '_blank';
      name.textContent = s.name;
      const meta = document.createElement('div');
      meta.className = 'meta';
      const status = document.createElement('span');
      status.className = 'status-' + s.status;
      status.textContent = t('status.' + s.status);
      meta.append(s.type + ' · ', status);
      if (s.chars) meta.append(' · ' + t('sources.chars', { count: formatNumber(s.chars) }));
      if (s.pages) meta.append(' · ' + t('sources.pages', { count: s.pages }));
      li.append(name, meta);
      if (s.error) {
        const err = document.createElement('div');
        err.className = 'meta status-error';
        err.textContent = s.error;
        li.append(err);
      }
      list.append(li);
    });
    const ready = sources.filter(s => s.status === 'ok').length;
    const todo = sources.filter(s => TO_PROCESS.includes(s.status)).length;
    $('sources-summary').textContent = sources.length
      ? t('sources.summary', { total: sources.length, ready: ready, todo: todo })
      : t('sources.empty');
  }

  async function loadSources() {
    if (!settings.sourceFolderName) return;
    sources = await call('listSources');
    renderSources();
  }

  async function loadAssistant() {
    if (!settings.sourceFolderName) return;
    assistant = await call('getAssistantSources');
    renderAssistant();
  }

  function renderAssistant() {
    const hasSources = assistant.sources.length > 0;
    $('assistant-no-sources').classList.toggle('hidden', hasSources || !settings.sourceFolderName);
    $('assistant-content').classList.toggle('hidden', !hasSources);
    const list = $('assistant-source-list');
    list.innerHTML = '';
    assistant.sources.forEach(s => {
      const li = document.createElement('li');
      const label = document.createElement('label');
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = s.selected;
      box.addEventListener('change', () => { s.selected = box.checked; selectionChanged(); });
      const name = document.createElement('span');
      name.textContent = s.name;
      label.append(box, name);
      li.append(label);
      list.append(li);
    });
    renderAssistantSummary();
  }

  function renderAssistantSummary() {
    const selected = assistant.sources.filter(s => s.selected);
    const chars = selected.reduce((sum, s) => sum + (s.chars || 0), 0) + (fragment ? fragment.chars : 0);
    $('assistant-sources-summary').textContent = t('assistant.sourcesSummary', { selected: selected.length, total: assistant.sources.length });
    $('assistant-size').textContent = t('assistant.size', { chars: formatNumber(chars) });
    $('assistant-size-warning').classList.toggle('hidden', chars <= assistant.warnChars);
  }

  function selectionChanged() {
    renderAssistantSummary();
    const excluded = assistant.sources.filter(s => !s.selected).map(s => s.id);
    google.script.run.withFailureHandler(e => showMessage(errorText(e), 'error')).saveAssistantSelection(excluded);
  }

  function selectAllSources(selected) {
    assistant.sources.forEach(s => { s.selected = selected; });
    renderAssistant();
    selectionChanged();
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  let fragment = null;

  async function attachFragment() {
    fragment = await call('getSelectedFragment');
    renderFragment();
  }

  function removeFragment() {
    fragment = null;
    renderFragment();
  }

  function renderFragment() {
    $('fragment-box').classList.toggle('hidden', !fragment);
    $('fragment-title').textContent = fragment ? t('assistant.fragment.title', { chars: formatNumber(fragment.chars) }) : '';
    $('fragment-text').textContent = fragment ? fragment.text : '';
    $('btn-attach-fragment').textContent = t(fragment ? 'assistant.fragment.replace' : 'assistant.fragment.attach');
    $('question').placeholder = t(fragment ? 'assistant.fragment.placeholder' : 'assistant.placeholder');
    renderAssistantSummary();
  }

  async function askAssistant() {
    const attached = fragment;
    const question = $('question').value.trim() || (attached ? t('assistant.fragment.defaultQuestion') : '');
    const selected = assistant.sources.filter(s => s.selected);
    const result = await callGemini($('btn-ask'), 'askAssistant', question, selected.map(s => s.id), [], attached ? attached.text : '');
    if (!result) return;
    hideMessage();
    if (fragment === attached) removeFragment();
    const thread = {
      sourceIds: selected.map(s => s.id),
      sourceNames: selected.map(s => s.name),
      fragment: attached ? attached.text : '',
      turns: [],
    };
    thread.element = renderThread(thread, question);
    document.querySelectorAll('#answers > .thread').forEach(card => { card.open = false; });
    $('answers').prepend(thread.element);
    addTurn(thread, question, result);
    $('question').value = '';
    notifyAssistant();
  }

  async function followUp(thread, input, button) {
    const question = input.value.trim();
    const history = thread.turns.map(turn => ({ question: turn.question, answer: turn.answer }));
    const result = await callGemini(button, 'askAssistant', question, thread.sourceIds, history, thread.fragment);
    if (!result) return;
    hideMessage();
    addTurn(thread, question, result);
    input.value = '';
    notifyAssistant();
  }

  function renderThread(thread, firstQuestion) {
    const card = el('details', 'thread');
    card.open = true;
    const title = thread.fragment ? (UI_LANG === 'pl' ? '„' : '“') + thread.fragment.slice(0, 80) + '” · ' + firstQuestion : firstQuestion;
    card.append(el('summary', 'thread-title', title));
    card.append(el('div', 'thread-sources', t('assistant.threadSources', { names: thread.sourceNames.join(', ') })));
    if (thread.fragment) {
      const box = el('details', 'thread-fragment');
      box.append(el('summary', '', t('assistant.fragment.inThread')), el('div', 'fragment-text', thread.fragment));
      card.append(box);
    }
    thread.turnsElement = el('div', 'turns');
    card.append(thread.turnsElement);

    const reply = el('div', 'reply hidden');
    const input = el('textarea');
    input.rows = 2;
    input.placeholder = t('assistant.followUpPlaceholder');
    const send = el('button', 'primary', t('assistant.send'));
    send.addEventListener('click', () => runInBackground(send, () => followUp(thread, input, send)));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        runInBackground(send, () => followUp(thread, input, send));
      }
    });
    reply.append(input, send);

    const open = el('button', 'link', t('assistant.followUp'));
    open.addEventListener('click', () => {
      open.classList.add('hidden');
      reply.classList.remove('hidden');
      input.focus();
    });
    card.append(open, reply);
    return card;
  }

  function addTurn(thread, question, result) {
    const turn = el('div', 'turn');
    turn.append(el('div', 'bubble', question));
    if (result.raw) {
      turn.append(el('div', 'not-found', t('assistant.rawNote')), el('p', 'raw', result.raw));
      thread.turns.push({ question: question, answer: result.raw });
      thread.turnsElement.append(turn);
      return;
    }
    if (!result.found) turn.append(el('div', 'not-found', t('assistant.notFound')));
    const answer = el('div', 'answer');
    result.answer.split(/\n{2,}/).forEach(part => answer.append(el('p', '', part.trim())));
    turn.append(answer);
    if (result.citations.length) {
      const cites = el('details', 'cites');
      cites.append(el('summary', '', t('assistant.citations', { count: result.citations.length })));
      const list = el('ol');
      result.citations.forEach(c => list.append(renderCitation(c)));
      cites.append(list);
      turn.append(cites);
    }
    thread.turns.push({ question: question, answer: result.answer });
    thread.turnsElement.append(turn);
  }

  function renderCitation(c) {
    const li = document.createElement('li');
    if (c.known) {
      const link = document.createElement('a');
      link.href = c.sourceUrl;
      link.target = '_blank';
      link.textContent = c.sourceName;
      li.append(link);
    } else {
      li.append(t('assistant.unknownSource', { name: c.sourceName }));
    }
    if (c.page) li.append(', ' + t('assistant.page', { page: c.page }));
    else if (c.location) li.append(', ' + c.location);
    const badge = document.createElement('span');
    badge.className = 'badge ' + c.quoteStatus;
    badge.textContent = ' · ' + t('assistant.quote.' + c.quoteStatus);
    li.append(badge);
    if (c.quote) {
      const quote = document.createElement('div');
      quote.className = 'quote';
      quote.textContent = (UI_LANG === 'pl' ? '„' : '“') + c.quote + '”';
      li.append(quote);
    }
    return li;
  }

  function setProgress(box, text) {
    box.textContent = text;
    box.prepend(el('span', 'spinner'));
  }

  async function processSources() {
    const progress = $('process-progress');
    progress.classList.remove('hidden');
    try {
      setProgress(progress, t('sources.cleaning'));
      const cleanup = await call('cleanupSources');
      await loadSources();
      const removedNote = cleanup.removed ? ' ' + t('sources.removedNote', { count: cleanup.removed }) : '';
      const queue = sources.filter(s => TO_PROCESS.includes(s.status));
      if (!queue.length) {
        showMessage(t('sources.allDone') + removedNote, 'ok');
        return;
      }
      let failed = 0;
      for (let i = 0; i < queue.length; i++) {
        setProgress(progress, t('sources.progress', { current: i + 1, total: queue.length, name: queue[i].name }));
        const updated = await call('processSource', queue[i].id);
        if (updated.status === 'error') failed++;
        sources = sources.map(s => s.id === updated.id ? updated : s);
        renderSources();
      }
      showMessage(
        (failed ? t('sources.doneWithErrors', { count: failed }) : t('sources.done')) + removedNote,
        failed ? 'error' : 'ok'
      );
      await loadAssistant();
    } finally {
      progress.classList.add('hidden');
    }
  }

  document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));

  $('btn-refresh').addEventListener('click', () => run(loadSources));
  $('btn-process').addEventListener('click', () => run(processSources));

  $('btn-save-folder').addEventListener('click', () => run(async () => {
    settings = await call('saveSourceFolder', $('folder-input').value);
    $('folder-input').value = '';
    showMessage(t('settings.folder.saved', { name: settings.sourceFolderName }), 'ok');
    await loadSources();
  }));

  $('btn-save-key').addEventListener('click', () => run(async () => {
    settings = await call('saveApiKey', $('key-input').value);
    $('key-input').value = '';
    showMessage(t('settings.key.saved'), 'ok');
    await loadModels();
  }));

  $('btn-clear-key').addEventListener('click', () => run(async () => {
    settings = await call('clearApiKey');
    fillModels([]);
    showMessage(t('settings.key.removed'), 'ok');
  }));

  $('btn-save-model').addEventListener('click', () => run(async () => {
    settings = await call('saveModel', $('model-select').value);
    showMessage(t('settings.model.saved', { model: settings.model }), 'ok');
  }));

  $('btn-test').addEventListener('click', () => run(async () => {
    const result = await callGemini($('btn-test'), 'testGeminiConnection');
    if (!result) return;
    showMessage(t('ai.testOk', { model: result.model, reply: result.reply }), 'ok');
  }));

  $('btn-save-language').addEventListener('click', () => run(() => call('saveUiLanguage', $('language-select').value)));

  let update = null;

  async function checkForUpdate(force) {
    $('update-status').textContent = t('update.checking');
    try {
      update = await call('checkForUpdate', force);
    } catch (e) {
      update = null;
      $('update-status').textContent = errorText(e);
    }
    renderUpdate();
  }

  function renderUpdate() {
    const available = !!(update && update.available);
    if (update) {
      $('update-status').textContent = available
        ? t('update.available', { latest: update.latest, current: update.current })
        : t('update.upToDate', { version: update.current });
    }
    $('update-notes').textContent = available ? update.notes : '';
    $('update-notes').classList.toggle('hidden', !available || !update.notes);
    $('btn-install-update').classList.toggle('hidden', !available);
    $('update-install-hint').classList.toggle('hidden', !available);
    const tab = document.querySelector('.tab[data-tab="settings"]');
    tab.querySelectorAll('.tab-dot').forEach(node => node.remove());
    if (available) tab.append(el('span', 'tab-dot'));
  }

  $('btn-check-update').addEventListener('click', () => runInBackground($('btn-check-update'), () => checkForUpdate(true)));
  $('btn-install-update').addEventListener('click', () => window.open(update.installerUrl, '_blank'));

  let typo = null;
  const typoOpen = new Set();
  const TYPO_SHOW_SPACES = ['orphan', 'spaces', 'punctuation', 'dash'];

  async function checkTypography() {
    const button = $('btn-check-typo');
    button.classList.add('loading');
    try {
      typo = await call('checkTypography');
      renderTypography();
    } finally {
      button.classList.remove('loading');
    }
  }

  function renderTypography() {
    const groups = typo.groups.filter(g => g.count > 0);
    const total = groups.reduce((sum, g) => sum + g.count, 0);
    $('typo-summary').textContent = total ? t('typo.summary', { count: formatNumber(total) }) : t('typo.none');
    $('typo-summary').classList.remove('hidden');
    const box = $('typo-groups');
    box.innerHTML = '';
    groups.forEach(group => box.append(renderTypoGroup(group)));
  }

  function renderTypoGroup(group) {
    const card = el('details', 'typo-group');
    card.open = typoOpen.has(group.kind);
    card.addEventListener('toggle', () => card.open ? typoOpen.add(group.kind) : typoOpen.delete(group.kind));
    card.append(el('summary', '', t('typo.kind.' + group.kind + '.title') + ' (' + formatNumber(group.count) + ')'));
    card.append(el('div', 'typo-desc', t('typo.kind.' + group.kind + '.desc')));
    const fixAll = el('button', '', t('typo.fixAll', { count: formatNumber(group.count) }));
    fixAll.addEventListener('click', () => run(() => fixTypographyKind(group.kind, fixAll)));
    const row = el('div', 'row buttons');
    row.append(fixAll);
    card.append(row);
    if (group.count > group.items.length) {
      card.append(el('div', 'typo-desc', t('typo.more', { shown: group.items.length, count: formatNumber(group.count) })));
    }
    const list = el('ul', 'list');
    group.items.forEach(item => list.append(renderTypoItem(item)));
    card.append(list);
    return card;
  }

  function renderTypoItem(item) {
    const li = el('li');
    const snippet = el('div', 'typo-snippet');
    snippet.title = t('typo.show');
    if (item.footnote) snippet.append(el('span', 'typo-where', t('typo.footnote')));
    const match = TYPO_SHOW_SPACES.includes(item.ref.kind) ? item.match.replace(/ /g, '·') : item.match;
    snippet.append(item.before, el('mark', '', match), item.after);
    snippet.addEventListener('click', () => {
      hideMessage();
      call('showTypographyIssue', item.ref).catch(e => showMessage(errorText(e), 'error'));
    });
    const fix = el('button', 'link', t('typo.fix'));
    fix.addEventListener('click', () => run(() => fixTypographyIssue(item)));
    li.append(snippet, fix);
    return li;
  }

  async function fixTypographyIssue(item) {
    const update = await call('fixTypographyIssue', item.ref);
    update.items.forEach(fresh => { fresh.order = item.order; });
    typo.groups.forEach(group => {
      group.count += (update.after[group.kind] || 0) - (update.before[group.kind] || 0);
      group.items = group.items
        .filter(other => other.ref.key !== update.key)
        .concat(update.items.filter(fresh => fresh.ref.kind === group.kind))
        .sort((a, b) => a.order - b.order || a.ref.start - b.ref.start);
    });
    renderTypography();
  }

  async function fixTypographyKind(kind, button) {
    button.classList.add('loading');
    try {
      const response = await call('fixTypographyKind', kind);
      typo = response.result;
      renderTypography();
      showMessage(t('typo.fixed', { count: formatNumber(response.fixed) }) + ' ' + t('typo.versionHint'), 'ok');
    } finally {
      button.classList.remove('loading');
    }
  }

  let format = null;
  let formatRulesLoaded = false;
  const formatOpen = new Set();
  const RULE_FIELDS = {
    'font': 'rule-font',
    'size': 'rule-size',
    'lineSpacing': 'rule-line-spacing',
    'alignment': 'rule-alignment',
    'indent': 'rule-indent',
    'black': 'rule-black',
    'a4': 'rule-a4',
    'margins.top': 'rule-margin-top',
    'margins.right': 'rule-margin-right',
    'margins.bottom': 'rule-margin-bottom',
    'margins.left': 'rule-margin-left',
    'heading1.size': 'rule-h1-size',
    'heading1.bold': 'rule-h1-bold',
    'heading1.uppercase': 'rule-h1-upper',
    'heading2.size': 'rule-h2-size',
    'heading2.bold': 'rule-h2-bold',
    'noHeadingPeriod': 'rule-no-period',
    'chapterNewPage': 'rule-new-page',
    'captionSize': 'rule-caption-size',
  };

  function ruleValue(rules, path) {
    return path.split('.').reduce((value, key) => value === null || value === undefined ? value : value[key], rules);
  }

  function setRuleInput(path, value) {
    const input = path.indexOf('structure.') === 0 ? $(STRUCTURE_FIELDS[path.slice(10)]) : $(RULE_FIELDS[path]);
    if (!input) return;
    if (input.type === 'checkbox') input.checked = value === true || value === 'true';
    else if (value === null || value === undefined) input.value = '';
    else input.value = input.type === 'number' ? String(value).replace(',', '.').replace(/[^\d.]/g, '') : value;
  }

  function ruleLabel(path) {
    const [group, key] = path.split('.');
    if (group === 'structure') {
      const labels = {
        sectionsReview: t('structure.rules.title') + ': ' + t('structure.type.review'),
        sectionsResearch: t('structure.rules.title') + ': ' + t('structure.type.research'),
        toc: t('structure.rules.toc'),
        numbering: t('structure.rules.numbering'),
        keywordsMin: t('structure.rules.keywords') + ': ' + t('structure.from'),
        keywordsMax: t('structure.rules.keywords') + ': ' + t('structure.to'),
        abstractMin: t('structure.rules.abstract') + ': ' + t('structure.from'),
        abstractMax: t('structure.rules.abstract') + ': ' + t('structure.to'),
        aimMin: t('structure.rules.aim') + ': ' + t('structure.from'),
        aimMax: t('structure.rules.aim') + ': ' + t('structure.to'),
        minPages: t('structure.rules.minPages'),
      };
      return labels[key] || path;
    }
    if (path === 'size') return t('format.rules.text') + ': ' + t('format.rules.size');
    if (group === 'margins') return t('format.rules.margins') + ': ' + t('format.rules.' + key);
    if (group === 'heading1' || group === 'heading2') {
      const name = key === 'size' ? 'format.rules.size' : key === 'bold' ? 'format.rules.bold' : 'format.rules.uppercase';
      return t('format.rules.' + group) + ': ' + t(name);
    }
    return t('format.rules.' + group);
  }

  async function loadFormatRules() {
    const data = await call('getFormatRules');
    $('skip-title-page').checked = data.skipTitlePage;
    fillFormatRules(data.rules);
    $('format-rules-example').classList.toggle('hidden', !data.isDefault);
    formatRulesLoaded = true;
  }

  async function resetFormatRules() {
    fillFormatRules(await call('resetFormatRules'));
    $('format-rules-example').classList.remove('hidden');
    showMessage(t('rules.resetDone'), 'ok');
  }

  function fillFormatRules(rules) {
    Object.keys(RULE_FIELDS).forEach(path => setRuleInput(path, ruleValue(rules, path)));
  }

  function readFormatRules() {
    const rules = { margins: {}, heading1: {}, heading2: {} };
    Object.keys(RULE_FIELDS).forEach(path => {
      const input = $(RULE_FIELDS[path]);
      const value = input.type === 'checkbox' ? input.checked : input.value;
      const [group, key] = path.split('.');
      if (key) rules[group][key] = value;
      else rules[group] = value;
    });
    return rules;
  }

  async function importFormatRules() {
    if (!formatRulesLoaded) await Promise.all([loadFormatRules(), loadStructureRules()]);
    const result = await callGemini($('btn-import-rules'), 'importFormatRules');
    if (!result) return;
    fillFormatRules(result.rules);
    fillImportedStructure(result.structure);
    $('format-rules-example').classList.add('hidden');
    $('structure-rules-example').classList.add('hidden');
    document.querySelectorAll('.check-section').forEach(section => {
      if (section.dataset.section !== 'typography') section.open = true;
    });
    $('format-rules').open = true;
    $('structure-rules').open = true;
    renderRulesImport(result);
    showMessage(t('format.rules.imported', { count: result.found }), 'ok');
  }

  let importedSections = null;

  function fillImportedStructure(imported) {
    importedSections = imported.sections;
    const sections = imported.sections[$('srule-type').value];
    if (sections) $('srule-sections').value = sections;
    if (imported.toc !== null) $('srule-toc').checked = imported.toc;
    if (imported.numbering !== null) $('srule-numbering').checked = imported.numbering;
    ['keywordsMin', 'keywordsMax', 'abstractMin', 'abstractMax', 'aimMin', 'aimMax', 'minPages'].forEach(key => {
      $(STRUCTURE_FIELDS[key]).value = imported[key] === null ? '' : imported[key];
    });
  }

  async function saveAllRules() {
    await call('saveFormatRules', readFormatRules());
    await call('saveStructureRules', readStructureRules());
    $('rules-import-result').classList.add('hidden');
    showMessage(t('format.rules.bothSaved'), 'ok');
  }

  function renderRulesImport(result) {
    const box = $('rules-import-result');
    box.innerHTML = '';
    box.classList.remove('hidden');
    box.append(el('div', 'typo-desc', t('format.rules.reviewHint')));
    const save = el('button', 'primary', t('format.rules.saveBoth'));
    save.addEventListener('click', () => run(saveAllRules));
    const row = el('div', 'row buttons');
    row.append(save);
    box.append(row);
    if (result.conflicts.length) {
      box.append(el('div', 'rules-conflicts-title', t('format.rules.conflicts')));
      result.conflicts.forEach((conflict, index) => {
        const fieldset = el('div', 'rules-conflict');
        fieldset.append(el('div', 'rules-conflict-field', ruleLabel(conflict.field)));
        conflict.options.forEach((option, optionIndex) => {
          const label = el('label', 'rules-check');
          const radio = el('input');
          radio.type = 'radio';
          radio.name = 'rules-conflict-' + index;
          radio.checked = optionIndex === 0;
          radio.addEventListener('change', () => setRuleInput(conflict.field, option.value));
          label.append(radio, option.value + ' (' + option.source + ')');
          fieldset.append(label);
        });
        box.append(fieldset);
      });
    }
    if (result.evidence.length) {
      const details = el('details', 'cites');
      details.append(el('summary', '', t('format.rules.evidence', { count: result.evidence.length })));
      const list = el('ol');
      result.evidence.forEach(item => {
        const li = el('li', '', ruleLabel(item.field) + ' – ' + item.source);
        li.append(el('div', 'quote', (UI_LANG === 'pl' ? '„' : '“') + item.quote + '”'));
        list.append(li);
      });
      details.append(list);
      box.append(details);
    }
  }

  async function saveFormatRules() {
    const rules = await call('saveFormatRules', readFormatRules());
    fillFormatRules(rules);
    $('format-rules-example').classList.add('hidden');
    showMessage(t('format.rules.saved'), 'ok');
  }

  async function checkFormatting() {
    const button = $('btn-check-format');
    button.classList.add('loading');
    try {
      format = await call('checkFormatting');
      renderFormatting();
    } finally {
      button.classList.remove('loading');
    }
  }

  function renderFormatting() {
    const groups = format.groups.filter(g => g.count > 0);
    const total = groups.reduce((sum, g) => sum + g.count, 0);
    const summary = $('format-summary');
    summary.textContent = total ? t('format.summary', { count: formatNumber(total) }) : t('format.none');
    if (format.noHeadings) summary.append(el('div', 'typo-desc', t('format.noHeadings')));
    summary.classList.remove('hidden');
    const box = $('format-groups');
    box.innerHTML = '';
    groups.forEach(group => box.append(renderFormatGroup(group)));
  }

  function renderFormatGroup(group) {
    const card = el('details', 'typo-group');
    card.open = formatOpen.has(group.kind);
    card.addEventListener('toggle', () => card.open ? formatOpen.add(group.kind) : formatOpen.delete(group.kind));
    card.append(el('summary', '', t('format.kind.' + group.kind + '.title') + ' (' + formatNumber(group.count) + ')'));
    card.append(el('div', 'typo-desc', t('format.kind.' + group.kind + '.desc')));
    const fixAll = el('button', '', t('typo.fixAll', { count: formatNumber(group.count) }));
    fixAll.addEventListener('click', () => run(() => fixFormatKind(group.kind, fixAll)));
    const row = el('div', 'row buttons');
    row.append(fixAll);
    card.append(row);
    if (group.count > group.items.length) {
      card.append(el('div', 'typo-desc', t('typo.more', { shown: group.items.length, count: formatNumber(group.count) })));
    }
    const list = el('ul', 'list');
    group.items.forEach(item => list.append(renderFormatItem(item)));
    card.append(list);
    return card;
  }

  function renderFormatItem(item) {
    const li = el('li');
    const snippet = el('div', 'typo-snippet' + (item.showable ? '' : ' static'));
    snippet.append(el('div', '', item.preview));
    if (item.detail) snippet.append(el('div', 'format-detail', item.detail));
    if (item.showable) {
      snippet.title = t('typo.show');
      snippet.addEventListener('click', () => {
        hideMessage();
        call('showFormatIssue', item.ref).catch(e => showMessage(errorText(e), 'error'));
      });
    }
    const fix = el('button', 'link', t('typo.fix'));
    fix.addEventListener('click', () => run(async () => {
      format = await call('fixFormatIssue', item.ref);
      renderFormatting();
    }));
    li.append(snippet, fix);
    return li;
  }

  async function fixFormatKind(kind, button) {
    button.classList.add('loading');
    try {
      const response = await call('fixFormatKind', kind);
      format = response.result;
      renderFormatting();
      showMessage(t('typo.fixed', { count: formatNumber(response.fixed) }) + ' ' + t('typo.versionHint'), 'ok');
    } finally {
      button.classList.remove('loading');
    }
  }

  let structure = null;
  let structureDefaults = null;
  const structureOpen = new Set();
  const STRUCTURE_FIELDS = {
    type: 'srule-type', sections: 'srule-sections', toc: 'srule-toc', numbering: 'srule-numbering',
    keywordsMin: 'srule-keywords-min', keywordsMax: 'srule-keywords-max',
    abstractMin: 'srule-abstract-min', abstractMax: 'srule-abstract-max',
    aimMin: 'srule-aim-min', aimMax: 'srule-aim-max', minPages: 'srule-min-pages',
  };

  async function loadStructureRules() {
    const data = await call('getStructureRules');
    structureDefaults = { sections: data.sections };
    fillStructureRules(data.rules);
    $('structure-rules-example').classList.toggle('hidden', !data.isDefault);
  }

  async function resetStructureRules() {
    fillStructureRules(await call('resetStructureRules', $('srule-type').value));
    importedSections = null;
    $('structure-rules-example').classList.remove('hidden');
    showMessage(t('rules.resetDone'), 'ok');
  }

  function fillStructureRules(rules) {
    Object.keys(STRUCTURE_FIELDS).forEach(key => {
      const input = $(STRUCTURE_FIELDS[key]);
      const value = rules[key];
      if (input.type === 'checkbox') input.checked = !!value;
      else input.value = value === null || value === undefined ? '' : value;
    });
  }

  function readStructureRules() {
    const rules = {};
    Object.keys(STRUCTURE_FIELDS).forEach(key => {
      const input = $(STRUCTURE_FIELDS[key]);
      rules[key] = input.type === 'checkbox' ? input.checked : input.value;
    });
    return rules;
  }

  function structureTypeChanged() {
    if (!structureDefaults) return;
    const sections = $('srule-sections');
    const type = $('srule-type').value;
    const known = Object.values(structureDefaults.sections).concat(importedSections ? Object.values(importedSections) : []);
    if (!sections.value.trim() || known.includes(sections.value)) {
      sections.value = (importedSections && importedSections[type]) || structureDefaults.sections[type];
    }
  }

  async function saveStructureRules() {
    const rules = await call('saveStructureRules', readStructureRules());
    fillStructureRules(rules);
    $('structure-rules-example').classList.add('hidden');
    showMessage(t('structure.rules.saved'), 'ok');
  }

  async function checkStructure() {
    const button = $('btn-check-structure');
    button.classList.add('loading');
    try {
      structure = await call('checkStructure');
      renderStructure();
    } finally {
      button.classList.remove('loading');
    }
  }

  function renderStructure() {
    const groups = structure.groups.filter(g => g.count > 0);
    const total = groups.reduce((sum, g) => sum + g.count, 0);
    const summary = $('structure-summary');
    summary.textContent = total ? t('structure.summary', { count: formatNumber(total) }) : t('structure.none');
    if (structure.pages !== null) summary.append(el('div', 'typo-desc', t('structure.pagesInfo', { count: structure.pages })));
    summary.classList.remove('hidden');
    const box = $('structure-groups');
    box.innerHTML = '';
    groups.forEach(group => box.append(renderStructureGroup(group)));
  }

  function renderStructureGroup(group) {
    const card = el('details', 'typo-group');
    card.open = structureOpen.has(group.kind);
    card.addEventListener('toggle', () => card.open ? structureOpen.add(group.kind) : structureOpen.delete(group.kind));
    card.append(el('summary', '', t('structure.kind.' + group.kind + '.title') + ' (' + formatNumber(group.count) + ')'));
    card.append(el('div', 'typo-desc', t('structure.kind.' + group.kind + '.desc')));
    const fixable = group.items.filter(item => item.fixable).length;
    if (fixable) {
      const fixAll = el('button', '', t('typo.fixAll', { count: formatNumber(fixable) }));
      fixAll.addEventListener('click', () => run(() => fixStructureKind(group.kind, fixAll)));
      const row = el('div', 'row buttons');
      row.append(fixAll);
      card.append(row);
    }
    const list = el('ul', 'list');
    group.items.forEach(item => list.append(renderStructureItem(item)));
    card.append(list);
    return card;
  }

  function renderStructureItem(item) {
    const li = el('li');
    const snippet = el('div', 'typo-snippet' + (item.showable ? '' : ' static'));
    snippet.append(el('div', '', item.preview));
    if (item.detail) snippet.append(el('div', 'format-detail', item.detail));
    if (item.showable) {
      snippet.title = t('typo.show');
      snippet.addEventListener('click', () => {
        hideMessage();
        call('showStructureIssue', item.ref).catch(e => showMessage(errorText(e), 'error'));
      });
    }
    li.append(snippet);
    if (item.fixable) {
      const fix = el('button', 'link', t('typo.fix'));
      fix.addEventListener('click', () => run(async () => {
        structure = await call('fixStructureIssue', item.ref);
        renderStructure();
      }));
      li.append(fix);
    }
    return li;
  }

  async function fixStructureKind(kind, button) {
    button.classList.add('loading');
    try {
      const response = await call('fixStructureKind', kind);
      structure = response.result;
      renderStructure();
      showMessage(t('typo.fixed', { count: formatNumber(response.fixed) }) + ' ' + t('typo.versionHint'), 'ok');
    } finally {
      button.classList.remove('loading');
    }
  }

  $('srule-type').addEventListener('change', structureTypeChanged);
  $('btn-save-structure-rules').addEventListener('click', () => run(saveStructureRules));
  $('btn-reset-structure-rules').addEventListener('click', () => run(resetStructureRules));
  $('btn-reset-rules').addEventListener('click', () => run(resetFormatRules));
  $('btn-check-structure').addEventListener('click', () => run(checkStructure));
  $('btn-save-rules').addEventListener('click', () => run(saveFormatRules));
  $('skip-title-page').addEventListener('change', () => {
    call('saveSkipTitlePage', $('skip-title-page').checked).catch(e => showMessage(errorText(e), 'error'));
  });
  $('btn-import-rules').addEventListener('click', () => runInBackground($('btn-import-rules'), importFormatRules));
  $('btn-check-format').addEventListener('click', () => run(checkFormatting));
  $('btn-check-typo').addEventListener('click', () => run(checkTypography));
  $('btn-attach-fragment').addEventListener('click', () => runInBackground($('btn-attach-fragment'), attachFragment));
  $('btn-remove-fragment').addEventListener('click', removeFragment);
  $('btn-feedback').addEventListener('click', () => switchTab('feedback'));
  $('btn-send-feedback').addEventListener('click', () => runInBackground($('btn-send-feedback'), sendFeedback));

  $('btn-select-all').addEventListener('click', () => selectAllSources(true));
  $('btn-select-none').addEventListener('click', () => selectAllSources(false));
  $('btn-ask').addEventListener('click', () => runInBackground($('btn-ask'), askAssistant));
  if ($('btn-enlarge')) $('btn-enlarge').addEventListener('click', () => run(() => call('showAssistantWindow')));
  $('question').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      runInBackground($('btn-ask'), askAssistant);
    }
  });

  run(async () => {
    settings = await call('getSettings');
    $('language-select').value = settings.uiLanguageSetting || '';
    $('link-installer').href = settings.updateUrl;
    checkForUpdate(false);
    renderSettings();
    if (!settings.sourceFolderId || !settings.hasApiKey) switchTab('settings');
    await Promise.all([loadSources(), loadModels(), loadAssistant()]);
  });
</script>
